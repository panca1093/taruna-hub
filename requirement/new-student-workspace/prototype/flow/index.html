<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Taruna Eduka — Student journey prototype</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="flow.css"></head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Navigasi utama">
    <a class="sidebar-brand" href="#/dashboard" data-page="dashboard" aria-label="Taruna Eduka"><span class="brand-symbol">T<span>.</span></span><span class="brand-name">Taruna Eduka<small>Ruang belajarmu</small></span></a>
    <button class="collapse" id="collapse" aria-label="Perluas sidebar" aria-expanded="false"><svg><use href="#chevron"/></svg></button>
    <nav id="main-nav">
      <a href="#/dashboard" data-page="dashboard" class="nav-item active" aria-current="page"><svg><use href="#dashboard"/></svg><span>Dashboard</span></a>
      <a href="#/latihan" data-page="tryout" class="nav-item"><svg><use href="#book"/></svg><span>Tryout</span></a>
      <a href="#/katalog" data-page="catalog" class="nav-item"><svg><use href="#grid"/></svg><span>Katalog</span></a>
    </nav>
    <div class="sidebar-bottom"><div class="sidebar-note"><svg><use href="#spark"/></svg><span>Selangkah<br>lebih siap.</span></div><button class="side-theme" data-action="theme" aria-label="Ganti tema"><svg><use href="#moon"/></svg><span>Ganti tema</span></button></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><a href="#/dashboard" data-page="dashboard" class="logo-link"><img src="../assets/logo.png" alt="Taruna Eduka"></a><span class="prototype-label">Konsep 02 <span>· Data contoh</span></span><div class="topbar-actions"><button class="balance-shortcut" data-account="wallet"><svg><use href="#wallet"/></svg><span id="balance-top">Rp107.000</span></button><button id="profile-trigger" class="profile-trigger" aria-label="Buka menu akun Naila" aria-expanded="false" aria-controls="profile-menu"><span class="avatar">N</span><span class="profile-name">Naila Ramadhani<small>Akun siswa</small></span><svg><use href="#down"/></svg></button></div></header>
    <main id="main-content" tabindex="-1"></main>
    <footer class="page-footer"><span>Taruna Eduka <span aria-hidden="true">✦</span> Selangkah lebih siap.</span><button id="review-trigger"><svg><use href="#sliders"/></svg> Coba tampilan</button></footer>
  </div>
</div>
<div id="profile-menu" class="profile-menu" hidden>
  <div class="menu-identity"><span class="avatar">N</span><div><strong>Naila Ramadhani</strong><small>naila@example.test</small></div></div>
  <button data-account="profile"><svg><use href="#user"/></svg><span>Profil akun<small>Identitas & keamanan akun</small></span><svg><use href="#arrow"/></svg></button>
  <button data-account="wallet"><svg><use href="#wallet"/></svg><span>Saldo & transaksi<small id="balance-menu">Saldo tersedia Rp107.000</small></span><svg><use href="#arrow"/></svg></button>
  <button data-account="orders"><svg><use href="#receipt"/></svg><span>Riwayat pesanan<small>Pembelian & status pembayaran</small></span><svg><use href="#arrow"/></svg></button>
  <div class="menu-preferences"><span>Tampilan</span><button data-action="theme" aria-label="Ganti tema"><svg><use href="#moon"/></svg></button><button data-page="pengaturan" aria-label="Pengaturan tampilan"><svg><use href="#sliders"/></svg></button></div>
  <button class="logout" data-action="logout"><svg><use href="#logout"/></svg>Keluar dari akun</button>
</div>
<dialog id="account-dialog" class="account-dialog"><button class="dialog-close" aria-label="Tutup"><svg><use href="#close"/></svg></button><div id="account-content"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M12 5C9 3 5 3 2 4v16c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-7-1-10 1v16"/></symbol>
<symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
<symbol id="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="spark" viewBox="0 0 24 24"><path d="m12 2 2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7L12 2Z"/></symbol>
<symbol id="moon" viewBox="0 0 24 24"><path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/></symbol>
<symbol id="wallet" viewBox="0 0 24 24"><path d="M20 8V5a2 2 0 0 0-2-2L5 6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h15V8H5"/><path d="M20 12h-5v5h5"/></symbol>
<symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></symbol>
<symbol id="receipt" viewBox="0 0 24 24"><path d="m5 3 3 2 4-2 4 2 3-2v19l-3-2-4 2-4-2-3 2V3Zm4 6h6m-6 5h6"/></symbol>
<symbol id="logout" viewBox="0 0 24 24"><path d="M9 3H3v18h6m5-15 6 6-6 6M8 12h12"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="sliders" viewBox="0 0 24 24"><path d="M4 4v7m0 4v5m8-16v2m0 4v10m8-16v10m0 4v2M1 11h6m2-5h6m2 8h6"/></symbol>
<symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L20 5"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 14l4-4 4 3 5-8"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
<symbol id="shield" viewBox="0 0 24 24"><path d="m12 2 8 3v6c0 6-8 11-8 11S4 17 4 11V5l8-3Z"/><path d="m8 11 3 3 5-5"/></symbol>
</defs></svg>
<script type="module" src="flow.js"></script>
</body></html>
