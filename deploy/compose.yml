# Production stack on the VPS (docs/deployment.md). Only Caddy publishes ports; everything else stays on
# the compose network. Images come from GHCR, tagged by deploy/deploy.sh through IMAGE_TAG.
name: taruna

x-app: &app
  image: ghcr.io/panca1093/taruna-hub-api:${IMAGE_TAG:?IMAGE_TAG is required}
  restart: unless-stopped
  environment:
    APP_ENV: production
    DATABASE_URL: postgres://tryout:${POSTGRES_PASSWORD}@postgres:5432/tryout?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: rustfs:9000
    S3_USE_SSL: "false"
    S3_PUBLIC_ENDPOINT: files.${DOMAIN}
    S3_PUBLIC_USE_SSL: "true"
    S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
    S3_SECRET_KEY: ${STORAGE_SECRET_KEY}
    S3_BUCKET: tryout-assets
    GOTENBERG_URL: http://gotenberg:3000
    APP_URL: https://${DOMAIN}
    CORS_ORIGINS: https://${DOMAIN}
    TENANT_SLUG: ${TENANT_SLUG:?TENANT_SLUG is required}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    NOTIFICATION_SEAL_KEY: ${NOTIFICATION_SEAL_KEY:?NOTIFICATION_SEAL_KEY is required}
    BANK_NAME: ${BANK_NAME:-}
    BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-}
    BANK_ACCOUNT_HOLDER: ${BANK_ACCOUNT_HOLDER:-}
    MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
    MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-}
    MIDTRANS_NOTIFICATION_URL: ${MIDTRANS_NOTIFICATION_URL:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_TLS: ${SMTP_TLS:-}

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # 443 only: Cloudflare's "Always Use HTTPS" redirects plain http at the edge.
    ports:
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddydata:/data
    depends_on:
      - web
      - api
      - rustfs

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tryout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: tryout
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryout -d tryout"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Throttle counters only; losing them is harmless, so no persistence.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible store for uploads; MinIO stopped publishing images, RustFS speaks the same API.
  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Outside development the API refuses to create the bucket, so it is made here, private.
  storage-init:
    image: rclone/rclone:1.76.0
    command: ["mkdir", "storage:tryout-assets"]
    environment: &rclone-storage
      RCLONE_CONFIG_STORAGE_TYPE: s3
      RCLONE_CONFIG_STORAGE_PROVIDER: Other
      RCLONE_CONFIG_STORAGE_ENDPOINT: http://rustfs:9000
      RCLONE_CONFIG_STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      RCLONE_CONFIG_STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
    depends_on:
      rustfs:
        condition: service_healthy

  # Nightly off-site copy to Cloudflare R2, started by deploy/backup.sh; never runs on `up`.
  backup:
    image: rclone/rclone:1.76.0
    profiles: ["backup"]
    environment:
      <<: *rclone-storage
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      - ./backups:/backups:ro

  gotenberg:
    image: gotenberg/gotenberg:8.34.0
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-allow-list=^file:///tmp/.*
      - --chromium-deny-list=^(?!file:///tmp/).*
      - --chromium-deny-private-ips
      - --chromium-deny-public-ips
      - --api-timeout=60s
      - --api-body-limit=64MB
      - --chromium-max-queue-size=10
      - --chromium-restart-after=50
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.1
    command: ["-path", "/migrations", "-database", "postgres://tryout:${POSTGRES_PASSWORD}@postgres:5432/tryout?sslmode=disable", "up"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    depends_on: &app-deps
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      <<: *app-deps
      gotenberg:
        condition: service_healthy

  web:
    image: ghcr.io/panca1093/taruna-hub-web:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  storagedata:
  caddydata:
