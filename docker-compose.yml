name: bimbel-tryout

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tryout
      POSTGRES_PASSWORD: tryout
      POSTGRES_DB: tryout
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryout -d tryout"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Stands in for GCS in production; question images and payment proofs land here.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tryout
      MINIO_ROOT_PASSWORD: tryout123
    # Host ports shifted off the defaults; 9000/9001 are already taken on this machine.
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
