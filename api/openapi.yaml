openapi: 3.0.3
info:
  title: Taruna Eduka — Tryout Platform API
  version: 0.1.0
  description: |
    Source of truth for the HTTP contract. The typed TypeScript client consumed by `web/`
    is generated from this file, so a breaking change here surfaces as a compile error in
    the frontend rather than a runtime surprise.

    Scope today is slice P00 (walking skeleton). Later slices extend this file; they do not
    fork it. No route authenticates yet: the first identity arrives with P03 login.

servers:
  - url: http://localhost:8081
    description: Local development

tags:
  - name: system
    description: Liveness and readiness probes

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: Reports process health only. Does not touch the database by design.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: |
        Reports whether this instance can serve traffic, including database reachability.

        The 503 body is this endpoint's own shape — `{status, reason}` — and deliberately
        not the error envelope.
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status:
                    type: string
                    example: unavailable
                  reason:
                    type: string
                    example: database unreachable

components:
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier. Switch on this, never on `message`.
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - validation_failed
                - internal_error
            message:
              type: string
              description: Human-readable, Indonesian, safe to show to end users.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Present on validation_failed — maps field name to reason.
            request_id:
              type: string
              description: Correlates with the server log line for this request.

  responses:
    Unauthorized:
      description: No valid identity on the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
