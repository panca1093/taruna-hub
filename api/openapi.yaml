openapi: 3.0.3
info:
  title: Taruna Eduka — Tryout Platform API
  version: 0.1.0
  description: |
    Source of truth for the HTTP contract. The typed TypeScript client consumed by `web/`
    is generated from this file, so a breaking change here surfaces as a compile error in
    the frontend rather than a runtime surprise.

    Scope today is slices P00–P05. Later slices extend this file; they do not fork it.
    Every `/api/v1/*` route runs under the one tenant the deployment is configured with, and the
    access token has to name that tenant, so a token minted for any other tenant is refused.
    P03a and P03b ship the API and the generated types only — the auth screens are P03c.

    Emails and phones are stored in one canonical form: a trimmed, lowercased email and an E.164
    phone (`0812…`, `62812…` and `+62 812-…` all become `+62812…`). Every route that takes an
    identifier normalizes it first, so any of those spellings reaches the same account.

servers:
  - url: http://localhost:8081
    description: Local development

tags:
  - name: system
    description: Liveness and readiness probes
  - name: tenant
    description: Public lookup of the configured tenant
  - name: auth
    description: Sessions, tokens and the authenticated principal
  - name: programs
    description: Tenant curriculum — programs, subjects and chapters
  - name: questions
    description: Tenant question bank — four types, immutable versions
  - name: tryouts
    description: Tenant tryouts — draft or published, assignments frozen per question version
  - name: wallet
    description: The student's own balance and immutable ledger
  - name: students
    description: Tenant students, their wallets and staff adjustments
  - name: assets
    description: Private image uploads, finalization and short-lived download links
  - name: orders
    description: Wallet and manual-transfer checkout, order review by staff, and the access an order opens
  - name: runtime
    description: The student's tryout attempt - start, subtests, answers, deadlines and the immediate basic result
  - name: results
    description: Staff view of completed attempts, ranking and IRT calibration warnings
  - name: settings
    description: Tenant settings an Admin changes, today the scoring weights
  - name: item-packages
    description: Kecermatan item packages - symbol, image, emoji and shape pools with frozen revisions
  - name: monitoring
    description: Tryout violation evidence the student's browser reports, and the staff view of active sessions and timelines

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: Reports process health only. Does not touch the database by design.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: |
        Reports whether this instance can serve traffic, including database reachability.

        The 503 body is this endpoint's own shape — `{status, reason}` — and deliberately
        not the error envelope.
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status:
                    type: string
                    example: unavailable
                  reason:
                    type: string
                    example: database unreachable

  /api/v1/tenant:
    get:
      tags: [tenant]
      summary: The configured tenant
      description: |
        Returns the tenant this deployment is configured with (`TENANT_SLUG`); the request host and
        headers never select it.

        An active tenant's slug and display name are public — the landing page needs them.
        A missing or inactive configured tenant answers `404` on every route, with the same code
        and message, so the API serves nothing until it is fixed.
      responses:
        "200":
          description: The configured tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for an access token
      description: |
        `identifier` matches either the email or the phone column, but only inside the
        configured tenant.

        Unknown identifier, inactive account and wrong password all answer the same `401` with the
        same message, and an account that does not exist costs the same password comparison as one
        that does. A password longer than 72 bytes is refused the same way, because bcrypt ignores
        everything past that.

        Attempts are counted per identifier before the password is checked: the 11th
        attempt within 15 minutes answers `429` with `Retry-After`, even with the right password.
        A successful login, or a password reset, clears the count.

        On success the refresh token is set as an `HttpOnly` cookie scoped to `/api/v1/auth` and is
        never part of the body. This route needs no `Origin`: it is authenticated by credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A session was opened
          headers:
            Set-Cookie:
              description: |
                `refresh_token=<opaque>; Path=/api/v1/auth; HttpOnly; SameSite=Lax; Max-Age=2592000`,
                plus `Secure` outside development.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Issue a new access token from the refresh cookie
      description: |
        Reads the refresh cookie, which must name a live session of the configured tenant. Idle time is
        enforced here: the server expires a session that has had no authenticated request for three
        hours. Refreshing is not activity, so it does not move that deadline — only an authenticated
        request on `/me` (or any later protected route) does.

        Every refresh rotates the token and sets the new one in the cookie. The replaced token keeps
        working for 30 seconds, so two tabs that refresh at once both succeed; such a response sets
        no cookie, because the winning refresh already set it. Presented after those 30 seconds, a
        replaced token can only be a copy, so the whole session is revoked and the current token
        stops working too.

        The refresh token never appears in the body. A request is refused with `403` unless its
        `Origin` is accepted by the CORS policy. A
        token that can never work again also clears the cookie.
      responses:
        "200":
          description: A fresh access token for the same session
          headers:
            Set-Cookie:
              description: The rotated `refresh_token`; absent on a refresh inside the 30-second grace.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the session behind the refresh cookie
      description: |
        Revocation takes effect on the very next request: the access token is refused immediately,
        because every request re-reads the session row. Always answers `204` and always clears the
        cookie, so a retry, a stale token or no token at all is not an error to the client.

        Like refresh, this route requires an `Origin` that the CORS policy accepts.
      responses:
        "204":
          description: The session is gone; the cookie is cleared with `Max-Age=0`
          headers:
            Set-Cookie:
              description: "`refresh_token=; Path=/api/v1/auth; HttpOnly; SameSite=Lax; Max-Age=0`"
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create a student account and open its session
      description: |
        D01: email is required and the phone is optional; both must be free in this tenant, and an
        account counts as holding them from the moment it is created, verified or not. The account
        exists at once and the answer is exactly a login's: a token body and the refresh cookie.

        A 6-digit code is emailed to verify the address. Verification never blocks a login; the web
        app reads `user.email_verified` and shows an alert until it is true. Someone who signed up
        with an address that is not theirs is undone by the real owner's password reset, which also
        verifies the email.

        At most 5 codes go to one email per hour across this route and `/me/email/resend`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account exists and a session is open
          headers:
            Set-Cookie:
              description: The `refresh_token` cookie, as on login.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An account already holds the email (`fields.email`) or the phone (`fields.phone`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      summary: Email a password reset link
      description: |
        FR-AUTH-03. Answers `202` with no body for every well-formed email, whether or not an account
        has it, so the answer reveals nothing. A matching active account gets a link to
        `/reset-password#token=…` on the web app (`APP_URL`). The token is signed and bound to the
        current password: it works for 30 minutes, and the first password change — through any link —
        ends every outstanding link. The limit is 3 requests per email per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: A link is on its way if the email belongs to an account here
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      description: |
        Sets the password, revokes every session of the account and marks its email verified, since
        following the emailed link proves the inbox. A forged, used or expired token
        answers `422` with `fields.token`. The user logs in again afterwards; no session is opened here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: The password is changed and every session is ended
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/email/verify:
    post:
      tags: [auth]
      summary: Verify the signed-in user's email with the emailed code
      description: |
        A code works for 10 minutes and 5 guesses; wrong guesses are counted even under concurrent
        requests. A wrong, expired, used-up or missing code answers `422` with `fields.code`.
        Verifying an already verified email is a `204` too.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "204":
          description: The email is verified
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/email/resend:
    post:
      tags: [auth]
      summary: Email the signed-in user a fresh verification code
      description: |
        Replaces the outstanding code and restores its 5 guesses. Within 60 seconds of the last
        code, or past 5 codes in an hour, this answers `429`. An already verified email answers `409`.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: A code is on its way
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The email is already verified, or the account has no email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me:
    get:
      tags: [auth]
      summary: The authenticated principal
      description: |
        Returns the caller the server rebuilt from the access token, the session row and the user
        row — not from the token alone. A revoked session, a role change or a deactivated account
        invalidates an old token on the next request. Balance and the ledger are not part of
        identity and are not published here.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/programs:
    get:
      tags: [programs]
      summary: The tenant's program tree
      description: |
        FR-ADM-PRG-02: the hierarchy the question and tryout dropdowns read. Programs come back in
        their stored order, each with its subjects and their chapters in position order.

        Admin and Operator may read it; a Student answers `403`. The tree is always the configured
        tenant — this slice has no master content and no copy-to-own.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every program of this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [programs]
      summary: Create a program with optional subjects and chapters
      description: |
        Admin only (FR-ADM-PRG-01). `code` is trimmed and uppercased, then must be 2–12 characters
        of `A-Z`, `0-9`, `_` or `-`; it is unique per tenant, so another tenant may use the same
        code. Subject and chapter names are trimmed, 1–100 characters, and unique among their
        siblings without regard to case. At most 50 subjects and 200 chapters per subject.

        Positions follow the order of the arrays. A duplicate code answers `409` with
        `fields.code`; a rule violation answers `422` with the failing field's path.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgramRequest"
      responses:
        "201":
          description: The program as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The code is already used in this tenant (`fields.code`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/programs/{id}:
    put:
      tags: [programs]
      summary: Replace a program's tree
      description: |
        Admin only. REPLACE semantics in one transaction with the program row locked: an item with an
        `id` is updated, an item without one is created, and an existing item the body no longer
        names is deleted. Positions are rewritten from the order of the arrays; the ids of kept items
        never change. Chapter ids are checked against this program, so a chapter may move to another
        of its own subjects but never to another program or tenant.

        An `id` that belongs to another program answers `422` naming its path (for example
        `subjects[1].id`). A program id of another tenant answers `404`, never `403`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgramRequest"
      responses:
        "200":
          description: The tree as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The code is already used in this tenant (`fields.code`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [programs]
      summary: Delete a program and its tree
      description: |
        Admin only. Chapters, then subjects, then the program are removed in one transaction. Nothing
        is ever deleted implicitly: if a chapter or subject is still referenced (questions and
        tryouts will do that from later slices), the database refuses and the whole delete rolls
        back, answering `409`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The program and its tree are gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The program, a subject or a chapter is still referenced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/questions:
    get:
      tags: [questions]
      summary: The tenant's question bank
      description: |
        FR-ADM-SOA-01/05: Admin and Operator read the bank; a Student answers `403`, because an answer
        key never leaves the staff API. Questions come back newest first (`number` descending), at most
        100 per page, with `total` counting every question the filters match.

        `q` is a case-insensitive substring of the content, and `%` or `_` in it match themselves.
      security:
        - bearerAuth: []
      parameters:
        - name: program_id
          in: query
          schema:
            type: string
            format: uuid
        - name: subject_id
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
            enum: [pg, pg_multi, isian, benar_salah]
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [easy, medium, hard]
        - name: q
          in: query
          description: Case-insensitive substring of the content; `%` and `_` are literal.
          schema:
            type: string
        - name: limit
          in: query
          description: Defaults to 50, at most 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of this tenant's questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [questions]
      summary: Create a question
      description: |
        Admin and Operator may write tenant content. Version 1 is created with the question, and its
        option ids are assigned by the server; the client may send a placeholder id such as `a` in
        `options[].id` and name it in `correct`, and the server answers with the real ids.

        `pg` takes 2–8 options and exactly one correct id; with `option_weighted` every option is valid
        instead and `correct` must be empty, each option carrying 0–100 points (at most 2 decimals).
        `pg_multi` takes 2–8 options and at least two correct ids, all-or-nothing at scoring time.
        `isian` takes no options and 1–10 accepted answers. `benar_salah` has the server's fixed
        `benar`/`salah` options and exactly one of them as the answer.

        Content is stored verbatim as text: markdown and LaTeX render in the client, no HTML is
        interpreted, and a `data:` or `javascript:` image URL answers `422` because images are deferred.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "201":
          description: The question as stored, at version 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/questions/{id}:
    get:
      tags: [questions]
      summary: One question of this tenant
      description: |
        A question id of another tenant answers `404`, never `403`, so an id reveals nothing.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The question at its current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [questions]
      summary: Save a new version of a question
      description: |
        Editing never rewrites what a tryout already used: when the normalized payload differs from
        the current version, a new immutable version is appended and the head row moves to it, in one
        transaction with that row locked. A payload identical to the current version answers `200` with
        the same version and writes nothing.

        `base_version` is the version the editor started from. If someone else has saved since, it no
        longer matches and the answer is `409`; the editor must reload rather than overwrite. An option
        id that belongs to this question keeps it, a missing id creates a new option, and an id of
        another question answers `422`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestionRequest"
      responses:
        "200":
          description: The question at its (possibly new) current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `base_version` is no longer the current version: someone else saved first. The message asks
            the editor to reload; no write happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [questions]
      summary: Delete a question and its versions
      description: |
        Versions, then the head row, are removed in one transaction. A version another slice already
        references (a tryout will, from P08) makes the database refuse and the whole delete roll back,
        answering `409`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The question and every version of it are gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A version of this question is still referenced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/questions/import/template:
    get:
      tags: [questions]
      summary: Download the import template
      description: |
        FR-ADM-SOA-04: the header plus two example rows (one `pg`, one `isian`), generated by the
        server and named after the first program, subject and chapter of this tenant, so the file can
        be filled in and imported as it is. The same parser reads all three formats back.

        Columns, case-insensitive and in any order: `type` (`pg|pg_multi|isian|benar_salah`),
        `program`, `subject`, `chapter` (optional), `difficulty` (`easy|medium|hard`, also
        `mudah|sedang|sulit`), `content`, `explanation` (optional), `option_a`..`option_h` (choice
        types), `correct` (option letters for the choice types, `|`-separated accepted answers for
        `isian`, `benar`/`salah` for `benar_salah`) and `case_sensitive` (`isian` only, yes/no).
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xlsx, csv, docx]
            default: xlsx
      responses:
        "200":
          description: The template file
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/questions/import/preview:
    post:
      tags: [questions]
      summary: Preview an uploaded question file
      description: |
        FR-ADM-SOA-04 and D08: every data row comes back with its real result. Nothing is written —
        the server parses the file itself and never trusts rows from the client.

        The file is untrusted: at most 5 MB and 500 data rows, the type is proved from the content
        (a ZIP header plus `xl/workbook.xml` or `word/document.xml` for XLSX/DOCX, valid BOM-less
        UTF-8 without NUL bytes for CSV), and decompression is bounded. Cell text is used verbatim,
        so a formula such as `=1+1` is stored as the literal text it is.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The .xlsx, .csv or .docx file.
      responses:
        "200":
          description: Every row with its result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionImportPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/questions/import/commit:
    post:
      tags: [questions]
      summary: Import the confirmed rows of an uploaded file
      description: |
        D08 default proposal, awaiting Panca: the user confirms an accepted set (by default every
        valid row) and the commit is ONE transaction for exactly that set. The file is sent again
        and re-parsed, because the server never trusts rows from the client.

        A selected row that is invalid, a row number that does not exist or a repeated row number
        answers `422` with `fields.rows` and writes nothing. Rows that are not selected are ignored
        even when invalid.

        Importing is idempotent: each row is keyed by the file digest and its row number, so
        uploading the same file again reports `already_imported` and creates no duplicate — also
        when a subset was imported first or two commits run at once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, rows]
              properties:
                file:
                  type: string
                  format: binary
                rows:
                  type: string
                  description: JSON array of the 1-based data row numbers to import, e.g. `[1,2,4]`.
                  example: "[1,2,4]"
      responses:
        "200":
          description: What the commit wrote, and which questions it created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionImportCommit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The configured tenant is missing or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/tryouts:
    get:
      tags: [tryouts]
      summary: The tenant's tryouts
      description: |
        Admin and Operator read the builder's list; a Student answers `403`. Newest first, at most 100
        per page, with `total` counting every tryout the filters match. Each row carries the subtest
        and question counts only — the full definition is `GET /api/v1/tryouts/{id}`.

        `q` is a case-insensitive substring of the title, and `%` or `_` in it match themselves.
      security:
        - bearerAuth: []
      parameters:
        - name: program_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published]
        - name: q
          in: query
          description: Case-insensitive substring of the title; `%` and `_` are literal.
          schema:
            type: string
        - name: limit
          in: query
          description: Defaults to 50, at most 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of this tenant's tryouts, without their subtests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryoutList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [tryouts]
      summary: Create a draft tryout
      description: |
        Admin and Operator may write tenant content. The tryout starts as `draft` at revision 1, so an
        incomplete definition is legal: drafts may have no subtests and a past `active_until`.

        `subtests[].questions` assigns questions in array order. A question without `version_id` takes
        its CURRENT version at this moment; that version id is frozen from then on, and editing the
        question later never changes the tryout.

        Limits: 30 subtests, 200 questions per subtest and 500 per tryout; a subtest lasts 60–28800
        seconds. A question of another tenant answers `422` on its own path and never reveals that it
        exists elsewhere.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTryoutRequest"
      responses:
        "201":
          description: The draft as stored, with its subtests and frozen assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tryout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/tryouts/{id}:
    get:
      tags: [tryouts]
      summary: One tryout with its subtests and assignments
      description: |
        Admin and Operator only. An id of another tenant answers `404`, never `403`. Each assignment is
        the read model of the frozen version and never carries `options`, `correct` or `explanation`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The tryout as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tryout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [tryouts]
      summary: Replace a tryout's definition
      description: |
        REPLACE semantics in one transaction with the tryout row locked `FOR UPDATE`. A `base_revision`
        that is no longer current answers `409` and writes nothing. A tryout whose
        `first_attempt_at` is set (stamped by P16's admission transaction under the same row lock) is
        locked: every edit answers `409` with "Tryout sudah dikerjakan siswa dan tidak bisa diubah."

        Assignments keep their frozen version: a `version_id` equal to the version this tryout already
        assigned to that question is kept, an absent `version_id` takes the question's current version,
        and any other `version_id` answers `422` on `subtests[i].questions[j].version_id`. A published
        tryout must still pass the publish rules on every save.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTryoutRequest"
      responses:
        "200":
          description: The tryout as replaced, with a revision one higher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tryout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale `base_revision`, or the tryout is locked after a first attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [tryouts]
      summary: Delete a tryout
      description: |
        Assignments, then subtests, then the tryout in one transaction. A locked tryout answers `409`
        and nothing is deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The tryout and its definition are gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The tryout is locked after a first attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/tryouts/{id}/publish:
    post:
      tags: [tryouts]
      summary: Publish a tryout
      description: |
        Publishing validates the playable definition: at least one subtest, every subtest with at least
        one question, and `active_until` after now. An invalid definition answers `422` with the failing
        field paths. Publishing an already published tryout is idempotent `200`; a locked tryout
        answers `409`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The published tryout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tryout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The tryout is locked after a first attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/tryouts/{id}/unpublish:
    post:
      tags: [tryouts]
      summary: Return a tryout to draft
      description: Answers `200` with the draft; already a draft is idempotent, and a locked tryout answers `409`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The draft tryout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tryout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The tryout is locked after a first attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

