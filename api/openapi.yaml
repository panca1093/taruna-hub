      description: Admin and Operator only, newest first. The id rules match the wallet above.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Defaults to 50, at most 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of the student's ledger, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletEntryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/students/{id}/wallet/adjustments:
    post:
      tags: [students]
      summary: Adjust one student's balance
      description: |
        Admin or Operator (D02: a role guard). A `credit` adds and a `debit`
        subtracts; `amount` is a positive decimal string with at most two fraction digits and the
        server signs it, so `1e3`, `1.234`, `0.00` and a minus sign all answer `422 on amount`.

        A movement that would take the balance below zero answers `422 on amount` with "Saldo tidak
        cukup." and writes nothing — it is never clamped. `reason` is required for every adjustment.

        `idempotency_key` (8–64 characters, `[A-Za-z0-9_-]`) identifies the financial operation: the
        same key with the same body answers `200` with the original entry and moves nothing, and the
        same key with another amount, type or student answers `409`. The first call answers `201`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
      responses:
        "201":
          description: The new ledger entry and the balance after it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentResult"
        "200":
          description: The original entry for this idempotency key, nothing written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/orders:
    post:
      tags: [orders]
      summary: Check out a product
      description: |
        Student only. The server checks that the product is active, inside its own sale window (`active_from` to
        `active_until`) and that every tryout is still published, then stores a snapshot of its title, price and
        tryouts on the order. The client sends `expected_price`, the price its page showed, and the server price must
        equal it.

        `payment_method` is `wallet` or `manual` (the gateway arrives with P14). A `wallet` order is debited,
        confirmed, granted and queued for notification in one transaction: if the balance is too low it answers
        `422` with code `insufficient_balance` and nothing is written. A `manual` order needs `proof_asset_id`, an
        unused `payment_proof` asset the caller uploaded through `POST /api/v1/assets`; it is finalized with the
        order and the order waits as `pending` for staff. Anyone else's, a missing, a wrongly typed or an already
        used proof answers the same `422` on `proof_asset_id`. `503` when no bank account is configured.

        `idempotency_key` (8–64 characters, `[A-Za-z0-9_-]`) identifies the purchase. The first call answers `201`;
        the same key for the same product, method and proof answers `200` with the original order and moves
        nothing; the same key for anything else answers `409`.

        An `individual` product whose tryout the student already holds with active access answers `409` with code
        `already_owned`. A `bundle` can still be bought: only the tryouts not yet held are granted.

        A student with a `pending` order for the product cannot create another (any method): `409` `order_pending`.
        A price that differs from `expected_price` answers `409` `price_changed` and writes nothing; a replay of an
        existing key returns its original order before either check.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: The new order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: The original order for this idempotency key, nothing written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `already_owned` (an individual product's tryout is already held), `price_changed` (the price differs
            from `expected_price`), `order_pending` (a pending order for this product exists) or `conflict` (the
            idempotency key belongs to a different order).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: |
            `validation_failed` with `fields`, or `insufficient_balance` when the wallet cannot pay the price.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [orders]
      summary: The signed-in student's own orders
      description: Student only. Newest first, at most 100 per page, only the caller's own orders.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Defaults to 50, at most 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of the student's orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/orders/{id}:
    get:
      tags: [orders]
      summary: One of the student's own orders
      description: Student only. Another student's order answers the same `404` as a missing one.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/enrollments:
    get:
      tags: [orders]
      summary: The tryouts the signed-in student holds ("Paket Belajar Saya")
      description: |
        Student only. The access window is the tryout's own `active_from` and `active_until`, read live; a
        purchase does not carry a window of its own (D05a).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every tryout the student holds, newest grant first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/payments/bank-transfer:
    get:
      tags: [orders]
      summary: Where a manual transfer is sent
      description: |
        Student only. The single tenant's account, from server configuration. `503` when it is not configured,
        which also makes manual checkout unavailable.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The bank account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransfer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/orders:
    get:
      tags: [orders]
      summary: Every order of the tenant, for review
      description: |
        Admin and Operator (D02: a role guard). Newest first, at most 100 per page. `status` narrows to one
        state. `q` is a case-insensitive substring of the order code, the student's name or the product title;
        `%` and `_` are literal. The proof is read through `GET /api/v1/assets/{id}/url` with `proof_asset_id`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled]
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          description: Defaults to 50, at most 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/orders/{id}:
    get:
      tags: [orders]
      summary: One order for review
      description: Admin and Operator only.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/orders/{id}/confirm:
    post:
      tags: [orders]
      summary: Accept a pending order's payment
      description: |
        Admin and Operator. Moves a `pending` order to `confirmed`, opens the tryouts it bought that the student
        does not hold yet and queues the email and WhatsApp notifications, all in one transaction. Repeating the
        call on a confirmed order answers `200` and changes nothing. A `cancelled` order answers `409`; a
        confirmed order never goes back to pending.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The order as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Refuse a pending order
      description: |
        Admin and Operator. Moves a `pending` order to `cancelled` with a required `reason` (1–500 characters),
        opens no access and queues the cancellation notifications. Repeating the call on a cancelled order
        answers `200` and keeps the first reason. A `confirmed` order answers `409`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
      responses:
        "200":
          description: The order as it now stands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/assets:
    post:
      tags: [assets]
      summary: Upload an image as a staged asset
      description: |
        Any signed-in tenant user may upload, but `purpose` narrows who: `payment_proof` is Student,
        Admin or Operator, `question_image` and `item_image` are Admin or Operator only (`403` otherwise).

        The file is untrusted. The real type is read from the bytes — PNG, JPEG or WebP only, so SVG, a
        renamed file and corrupt data are refused with `422` on `file` — and nothing reaches storage
        before that passes. PNG and JPEG are fully decoded; WebP is checked by its header and chunk
        structure only, because the Go standard library cannot decode it. The size may be at most
        4096 x 4096. The stored content type is the detected one, never the client's; the client's file
        name, path and any other form field are ignored, and the object key is generated by the server
        from the tenant, purpose and asset id. At most 5 MB: a larger body answers `413`.

        The asset starts `staged`. There is no finalize endpoint: the feature that attaches the asset
        finalizes it inside its own transaction, and a staged asset nobody finalizes is deleted, with its
        object, after 24 hours. `503` means object storage is not configured on this deployment.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PNG, JPEG or WebP image.
                purpose:
                  type: string
                  enum: [question_image, payment_proof, item_image]
      responses:
        "201":
          description: The staged asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/assets/{id}/url:
    get:
      tags: [assets]
      summary: A short-lived download link
      description: |
        Authorizes on every call: the asset must be in the caller's tenant, and the caller must be the
        uploader or an Admin or Operator. A `staged` asset is downloadable only by its uploader, and a
        student cannot yet read a staff-uploaded `question_image`: that path arrives with the slice that
        serves questions to students (P16). The
        link is a presigned GET valid for 60 seconds — whoever holds it can read the object until
        then, so ask again instead of keeping it. The response is `Cache-Control: private, no-store`.
        An id of another tenant, an unknown id and an asset the caller may not read all answer the
        same `404`, never `403`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The presigned link and when it stops working
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetURL"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/tryouts/{id}/grace:
    put:
      tags: [tryouts]
      summary: Change a tryout's late-answer grace, even while it is being attempted
      description: |
        Admin only (D10). The grace is the number of seconds after a subtest's deadline during which an answer is
        still admitted. It is the one tryout field that stays editable after the first attempt, and the runtime
        reads it live on every answer, so a change applies to every answer admitted after it commits.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraceRequest"
      responses:
        "200":
          description: The tryout with the new grace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tryout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/my/tryouts/{id}:
    get:
      tags: [runtime]
      summary: The student's overview of one tryout they hold
      description: |
        Student only. A tryout the student does not hold, or that is not published, answers `404`. `current` is the
        session in progress (deadlines already settled), `attempts` is every attempt newest first. Questions are
        never part of this response.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentTryout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/my/tryouts/{id}/sessions:
    post:
      tags: [runtime]
      summary: Start or resume an attempt
      description: |
        Student only, no body. Under the enrollment row lock this returns the student's session in progress, or
        admits a new attempt: the tryout must be published and inside `active_from`/`active_until`, the next attempt
        number is allocated and the question versions, the scoring weights (D04) and one stable permutation are
        frozen into the session. Concurrent starts end with one session. A session still in progress after the
        window closed is settled first and returned as completed. Not holding the tryout answers `404`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The session in progress, or the settled one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryoutSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`tryout_not_open` (draft or before `active_from`) or `tryout_closed` (past `active_until`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/my/tryout-sessions:
    get:
      tags: [runtime]
      summary: Every attempt of the signed-in student
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Attempts newest first, with the score once completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/my/tryout-sessions/{id}:
    get:
      tags: [runtime]
      summary: One session of the signed-in student
      description: |
        Another student's session, a staff caller or a malformed id never reveals existence. Any deadline that has
        passed is settled before the answer, so a reload after expiry shows the truth. `server_time` is the clock
        the countdown must use; `subtests[].deadline_at` already includes the tryout's grace and the subtest's staff extension. Subtest scores and
        `result` appear only once the session is completed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryoutSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/my/tryout-sessions/{id}/result:
    get:
      tags: [runtime]
      summary: The immediate basic result of a completed session
      description: |
        `score` is (earned points / maximum points) x 100 rounded to 2 decimals (D04). A session still in progress
        answers `409` `result_not_ready`. `ranking` is the student's current place among the tenant's participants of
        this tryout, computed on every call (D04): the mean of the student's completed-attempt scores, 2 decimals,
        ranked best first; equal averages share a rank and the next rank skips (1, 2, 2, 4). Every attempt of the
        same student therefore shows the same rank. `explanations_released` and `explanation_release_at` tell the
        page whether `GET .../review` will answer. The IRT warning is never part of a student response.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The result with the current rank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryoutResultDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`result_not_ready`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/my/tryout-sessions/{id}/review:
    get:
      tags: [runtime]
      summary: Questions, own answers, keys and explanations of one completed attempt
      description: |
        Only the owner's completed attempt, and only once the tryout's `explanation_release_at` is null or in the
        past. Before that the answer is `409` `explanations_not_released` and carries no key, no explanation and no
        question content. A session still in progress answers `409` `result_not_ready`. Another student's session,
        a staff caller and a malformed id never reveal existence. `correct` is the key as option ids (accepted
        texts for `isian`; empty for an option-weighted question, whose options carry `points` instead).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryoutReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`result_not_ready` or `explanations_not_released`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/my/tryout-sessions/{id}/subtests/{subtestId}:
    get:
      tags: [runtime]
      summary: The running subtest's questions and the student's saved answers
      description: |
        Only a running subtest is readable: a pending, submitted or expired one answers `409` `subtest_not_running`,
        so a submitted subtest cannot be reopened by URL. Questions come in this session's frozen order with options
        in this session's order. They never carry the answer key, option points, the explanation or a version id.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/SubtestId"
      responses:
        "200":
          description: The running subtest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSubtest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`subtest_not_running`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/my/tryout-sessions/{id}/subtests/{subtestId}/start:
    post:
      tags: [runtime]
      summary: Start the next subtest
      description: |
        The student's explicit action. Sets the part's start and absolute deadline once, as the earlier of start +
        duration and the tryout's `active_until` (D10). Every earlier subtest must be submitted and none may be
        running (`409` `subtest_order`). Starting a running subtest returns it unchanged, so a retry never moves
        the deadline; a submitted one answers `409` `subtest_not_running`; a completed session answers `409`
        `session_completed`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/SubtestId"
      responses:
        "200":
          description: The session with the part running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryoutSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`subtest_order`, `subtest_not_running` or `session_completed`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/my/tryout-sessions/{id}/subtests/{subtestId}/submit:
    post:
      tags: [runtime]
      summary: Submit the running subtest
      description: |
        Idempotent: a subtest already settled, by an earlier submit or by its deadline, answers `200` with the
        settled state. Submitting the last subtest finalizes the session and persists its one result before this
        response is written, so `result` is present on the completion response. An unstarted subtest answers `409`
        `subtest_not_running`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/SubtestId"
      responses:
        "200":
          description: The session after the submit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryoutSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`subtest_not_running`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/my/tryout-sessions/{id}/answers/{questionId}:
    put:
      tags: [runtime]
      summary: Save one answer
      description: |
        Admitted by server time against the subtest's effective deadline plus the tryout's grace (read live) plus any
        staff extension of this subtest (D10); no other grace exists. The `deadline_at` the student sees is already
        that sum. `seq` is the client's own per-question counter
        and the retry identity: a resend of the stored `seq` with the same answer is acknowledged unchanged, an
        older `seq` (or the same `seq` with another answer) answers `409` `stale_answer` and never overwrites, a
        newer one replaces. `revision` is server-assigned, monotonic per answer and moves only when the stored
        answer changes. An empty `answer` clears the question. A deadline noticed here settles the part for good and
        answers `409` `deadline_passed`; a pending or submitted part answers `409` `subtest_not_running`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: The accepted write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerAck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`stale_answer`, `deadline_passed` or `subtest_not_running`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/tryout-sessions/{id}/extensions:
    post:
      tags: [runtime]
      summary: Grant one student's session extra time
      description: |
        Admin and Operator (D10). Adds `seconds` to the one subtest that is running in this session when the call
        lands, never another subtest or another student's; later subtests keep their normal timing. The grant is
        appended to an audit table with the actor, the subtest and the reason. With no subtest running the call
        answers `409` `subtest_not_running`; a completed session, or a part whose deadline already passed, is not
        reopened, and a session settled by this call answers `409` `session_completed`. The monitoring page's session
        detail calls it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtensionRequest"
      responses:
        "200":
          description: The grant and the running subtest's total extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Extension"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`session_completed` or `subtest_not_running`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/my/tryout-sessions/{id}/violations:
    post:
      tags: [monitoring]
      summary: Report a violation on the student's own running tryout session
      description: |
        Student only, own session only (another student's or an unknown id is `404`). Tryout only; Kecermatan has
        no violations. The server stamps `occurred_at`; the browser's clock is never stored. A violation is
        evidence for staff and changes nothing about the attempt: the timer keeps running and nothing is
        submitted or penalized.

        Accepted only while the session is in progress and one of its subtests is running: a completed session
        answers `409` `session_completed`, and no running subtest answers `409` `subtest_not_running`.
        `event_id` is the retry identity: a resend of an event already stored answers `200` with the stored row
        and adds nothing; a new event answers `201`. Each session keeps at most 100 violations; the next new
        event answers `429` `too_many_requests` so a flood cannot grow the table.

        Browser support is best-effort: a device without the Fullscreen API (for example iPhone Safari) may still
        take the tryout and simply reports no `exit_fullscreen`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViolationRequest"
      responses:
        "200":
          description: The event was already stored; the stored violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Violation"
        "201":
          description: The violation was recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Violation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`session_completed` or `subtest_not_running`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          description: "`too_many_requests`: the session already holds 100 violations"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/admin/monitoring/sessions:
    get:
      tags: [monitoring]
      summary: Tryout sessions in progress right now
      description: |
        Admin and Operator (D02: a role guard). Every in-progress session of the tenant, newest start first, read
        from PostgreSQL on each call; the page polls every 30 seconds. `subtest` is the running subtest and is null
        between subtests. `violation_count` counts the stored violations of that session. Defaults to 100 per page,
        at most 200.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveSessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/tryout-sessions/{id}/violations:
    get:
      tags: [monitoring]
      summary: One session's violation timeline
      description: |
        Admin and Operator. Works for in-progress and completed sessions, so the history stays reachable after the
        attempt ends. Oldest first; a session holds at most 100 violations, so the list is not paged. An unknown id
        is `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The session and its timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViolationTimeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/results:
    get:
      tags: [results]
      summary: Completed attempts of the tenant with each student's current rank
      description: |
        Admin and Operator (D02: a role guard). Best current rank first, then newest, at most 100 per page.
        `tryout_id` narrows to one tryout. `q` is a case-insensitive substring of the student's name; `%` and `_`
        are literal. `rank` and `participant_count` are the student's current standing on that tryout (the same for
        every attempt of that student). `irt_warning` is true only for an IRT-mode attempt that holds a question
        version answered (non-blank, in a completed session) by fewer than 30 distinct students; retakes count
        once and a new question version starts at 0.
      security:
        - bearerAuth: []
      parameters:
        - name: tryout_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          description: Defaults to 50, at most 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffResultList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/tryouts/{id}/leaderboard:
    get:
      tags: [results]
      summary: The tenant's ranking of one tryout
      description: |
        Admin and Operator. Best first by the average of each student's completed attempts (2 decimals); ties share
        a rank and the next rank skips (1, 2, 2, 4). Computed from PostgreSQL on every call. At most 100 per page.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of standings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/settings:
    get:
      tags: [settings]
      summary: The tenant's scoring weights
      description: Admin only. Defaults to 1 / 2 / 3 until Admin saves one (D04).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current weights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [settings]
      summary: Save the scoring weights
      description: |
        Admin only. Each weight is greater than 0, at most 1000, with at most two decimals. A session freezes the
        weights when its attempt starts, so saving never changes a session already started or a stored result.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: The saved weights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/item-packages:
    get:
      tags: [item-packages]
      summary: This tenant's kecermatan item packages
      description: |
        P09, FR-ADM-KEC-11..15. Admin and Operator (D02). Each package carries its current revision,
        the size of that revision and the pool size a referencing test needs (`required_count`, zero
        when no test uses it), so the page can show "elements / minimum needed" (FR-ADM-KEC-15).
        Multi-tenancy is deferred (D17): every package is tenant-owned; there are no master packages.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ItemPackageType"
      responses:
        "200":
          description: Packages ordered by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPackageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [item-packages]
      summary: Create an empty item package
      description: |
        The package starts at revision 1 with no elements; elements arrive through the preview and
        commit routes. A name already used in this tenant (case-insensitive) answers `409` with
        `fields.name`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemPackageRequest"
      responses:
        "201":
          description: The new package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPackage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/item-packages/catalog:
    get:
      tags: [item-packages]
      summary: Built-in emoji catalog, shapes and symbol palette
      description: |
        The pickable sources the page offers without any upload: the emoji catalog (FR-ADM-KEC-24), the
        seven flat shapes and the click-to-add symbol palette (FR-ADM-KEC-16b). Emoji are single-codepoint
        and visually distinct only. Each emoji is drawn from the bundled Twemoji asset
        `/emoji/{id}.svg` (CC-BY 4.0), never from the device font, so it looks the same everywhere; the
        page must show `emoji_attribution` wherever the catalog is used.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/item-packages/symbol-template:
    get:
      tags: [item-packages]
      summary: Download the one-column symbol upload template
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [xlsx, csv]
            default: xlsx
      responses:
        "200":
          description: The template file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/item-packages/{id}:
    get:
      tags: [item-packages]
      summary: One package with the elements of a frozen revision
      description: |
        Without `revision` the current revision is returned. A positive `revision` up to the current one
        returns that frozen revision, so a test pinned to it keeps rendering exactly what it was built
        from. A package id of another tenant answers `404`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemPackageId"
        - name: revision
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The package and its elements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPackageDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    put:
      tags: [item-packages]
      summary: Rename a package
      description: A rename is not a content change and writes no revision.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemPackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameItemPackageRequest"
      responses:
        "200":
          description: The renamed package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPackage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [item-packages]
      summary: Delete an unused package
      description: |
        A package that any kecermatan test pins cannot be deleted: `409` with code `package_in_use` and
        nothing is removed (FR-ADM-KEC-14).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemPackageId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/item-packages/{id}/elements/preview:
    post:
      tags: [item-packages]
      summary: Preview an element upload without saving it
      description: |
        FR-ADM-KEC-18 and D09. Every candidate element comes back accepted or rejected with a reason;
        nothing is written - no element, no revision, no object. Which parts count depends on the package
        type, and a part that does not belong to it answers `422` with `fields.elements`:

        - `symbol`: `symbols` (typed or pasted, separated by spaces or new lines; the palette simply adds
          to this text) and/or one `file` (`.csv`, `.txt`, `.xlsx`, one column, at most 5 MB and 1000
          symbols). One symbol is one character; an emoji is rejected with `emoji_in_symbol`, a longer
          token with `symbol_multi`.
        - `image`: any number of `files` (at most 200), each a PNG, JPEG or WebP of at most 5 MB, and/or
          `.zip` files. SVG, corrupt and oversize images are rejected per element.
        - `emoji` / `shape`: repeated `ids` from the catalog; an unknown id is `not_in_catalog`.

        A ZIP is untrusted: at most 10 MB, 200 files and 50 MB extracted. An archive that breaks one of
        those limits (or is corrupt) is rejected as one element and nothing of it is read further. Inside
        a good archive each entry is judged alone: a path outside the folder (`..`, absolute, drive or
        backslash) is `path_traversal`, a symbolic link is `symlink`, an archive inside the archive is
        `nested_archive`. Duplicates are by exact symbol or by file-content SHA-256, never by file name:
        a copy of something the package already holds is `duplicate`, a repeat inside the upload is
        `duplicate_in_upload`. A package holds at most 500 elements; the rest are `package_full`.
        The request body is limited to 64 MB.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemPackageId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ItemElementsUpload"
      responses:
        "200":
          description: The verdict on every candidate element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemElementPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/item-packages/{id}/elements/commit:
    post:
      tags: [item-packages]
      summary: Save the accepted elements of an upload
      description: |
        The same parts as the preview, sent again and judged again by the server. The accepted elements
        are written together as ONE new revision in one transaction; rejected elements are never
        written. A commit is idempotent: sending the same upload twice finds everything already present,
        reports `added: 0` and writes no revision. Older revisions are never touched.
        `503` means object storage is not configured (image packages need it).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemPackageId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ItemElementsUpload"
      responses:
        "200":
          description: What the commit did
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemElementCommit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/item-packages/{id}/elements/{elementId}:
    delete:
      tags: [item-packages]
      summary: Remove one element
      description: |
        Writes a new revision without the element; older revisions keep it, so frozen content stays
        renderable. If a kecermatan test pins this package and the removal would leave fewer elements
        than that test needs, the answer is `409` with code `package_too_small` and nothing changes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemPackageId"
        - name: elementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The package at its new revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPackage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/item-packages/{id}/sample-column:
    post:
      tags: [item-packages]
      summary: Draw one sample column from the package ("Lihat contoh soal")
      description: |
        FR-ADM-KEC-21. Draws `soal_per_kolom` questions from the package's current elements, each with
        `options_per_soal` items of `item_length` distinct elements, all distinct within the question.
        Nothing is stored and nothing is metered. This is a preview of the pool, not the P10 generator:
        it has no seed, no reference item and no stability between calls. A pool smaller than
        `options_per_soal` x `item_length` answers `422` with `fields.elements` (FR-ADM-KEC-10).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemPackageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SampleColumnRequest"
      responses:
        "200":
          description: The sample column
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleColumn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>` from `/api/v1/auth/login`, valid for 15 minutes.
        HS256 only; issuer `taruna-api`, audience `taruna-web`.

  schemas:
    Tenant:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          description: Tenant slug, matching `TENANT_SLUG`. Immutable once created.
          example: taruna
        name:
          type: string
          description: Display name the landing page shows.
          example: Taruna Eduka

    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email or phone. Matched only within the configured tenant.
          example: naila@example.com
        password:
          type: string
          format: password
          description: At most 72 bytes; anything longer is refused like any other wrong password.

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 100
          example: Budi Santoso
        email:
          type: string
          description: Required (D01). Stored trimmed and lowercased.
          example: budi@example.com
        phone:
          type: string
          description: Optional. Indonesian local or international form; stored as E.164.
          example: 0812-3456-7890
        password:
          type: string
          format: password
          minLength: 8
          description: 8 characters to 72 bytes.

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          example: budi@example.com

    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "042917"

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: The value after `#token=` in the emailed link.
        password:
          type: string
          format: password
          minLength: 8
          description: 8 characters to 72 bytes.

    User:
      type: object
      additionalProperties: false
      required: [id, name, email, phone, role, email_verified]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
          description: Null when the account was created with a phone number only.
        phone:
          type: string
          nullable: true
          description: Null when the account was created with an email only.
        role:
          type: string
          enum: [student, operator, admin, platform_admin]
          description: |
            `platform_admin` accounts have no tenant and cannot sign in to the configured tenant.
        email_verified:
          type: boolean
          description: |
            False until the owner enters the emailed code or completes a password reset. D01: it
            never blocks anything; the web app shows an alert while it is false.

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: HS256 JWT for the `Authorization` header. Keep it in memory, not in storage.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 900
        user:
          $ref: "#/components/schemas/User"

    ProgramList:
      type: object
      additionalProperties: false
      required: [programs]
      properties:
        programs:
          type: array
          items:
            $ref: "#/components/schemas/Program"

    Program:
      type: object
      additionalProperties: false
      required: [id, code, name, description, subjects]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Unique per tenant. Always stored uppercased.
          example: SD
        name:
          type: string
        description:
          type: string
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/ProgramSubject"

    ProgramSubject:
      type: object
      additionalProperties: false
      required: [id, name, chapters]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/ProgramChapter"

    ProgramChapter:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CreateProgramRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          description: Trimmed and uppercased, then 2–12 characters of `A-Z`, `0-9`, `_` or `-`.
          example: SD
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        subjects:
          type: array
          maxItems: 50
          description: Order becomes `position`.
          items:
            $ref: "#/components/schemas/CreateSubjectRequest"

    CreateSubjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        chapters:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/CreateChapterRequest"

    CreateChapterRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100

    UpdateProgramRequest:
      type: object
      additionalProperties: false
      required: [code, name, description, subjects]
      properties:
        code:
          type: string
          description: Trimmed and uppercased, then 2–12 characters of `A-Z`, `0-9`, `_` or `-`.
          example: SD
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        subjects:
          type: array
          maxItems: 50
          description: |
            The complete tree: order becomes `position`, items without an `id` are created, and
            existing items missing from this array are deleted.
          items:
            $ref: "#/components/schemas/UpdateSubjectRequest"

    UpdateSubjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: Omit to create a subject; an existing id must belong to this program.
        name:
          type: string
          maxLength: 100
        chapters:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/UpdateChapterRequest"

    UpdateChapterRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: Omit to create a chapter; an existing id must belong to this program.
        name:
          type: string
          maxLength: 100

    QuestionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          description: |
            Assigned by the server and stable across versions; `benar`/`salah` for `benar_salah`.
        label:
          type: string
          maxLength: 500
        points:
          type: number
          minimum: 0
          maximum: 100
          description: |
            Only in weighted mode, at most 2 decimals. An option without points counts as 1 at scoring
            time (P16).

    Question:
      type: object
      additionalProperties: false
      required: [id, number, version, version_id, program_id, subject_id, chapter_id, type, content,
                 difficulty, explanation, option_weighted, case_sensitive, options, correct,
                 created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: The human ID the list shows (FR-ADM-SOA-06). Installation-wide, may skip.
        version:
          type: integer
          description: The current immutable version, starting at 1.
        version_id:
          type: string
          format: uuid
          description: The version row later slices reference (P08 assigns questions by version).
        program_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        content:
          type: string
          description: Stored verbatim as text; markdown and LaTeX render client-side.
        difficulty:
          type: string
          enum: [easy, medium, hard]
        explanation:
          type: string
        option_weighted:
          type: boolean
          description: Weighted-option mode, `pg` only.
        case_sensitive:
          type: boolean
          description: Short-answer matching, `isian` only.
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOption"
        correct:
          type: array
          description: Option ids for the choice types, accepted answers for `isian`, empty when weighted.
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QuestionList:
      type: object
      additionalProperties: false
      required: [questions, total]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        total:
          type: integer
          description: Every question the filters match, not only the page returned.

    QuestionOptionInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        id:
          type: string
          description: |
            An option id of this question keeps it; omit it to let the server assign one. A placeholder
            such as `a` may be named in `correct` and is replaced by the assigned id.
        label:
          type: string
          maxLength: 500
        points:
          type: number
          minimum: 0
          maximum: 100
          description: Weighted mode only, at most 2 decimals.

    CreateQuestionRequest:
      type: object
      additionalProperties: false
      required: [program_id, subject_id, type, content, difficulty]
      properties:
        program_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
          description: Must belong to `program_id`.
        chapter_id:
          type: string
          format: uuid
          nullable: true
          description: Optional; must belong to `subject_id`.
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        content:
          type: string
          maxLength: 20000
          description: Trimmed, 1–20000 characters. No HTML; `data:`/`javascript:` images are refused.
        difficulty:
          type: string
          enum: [easy, medium, hard]
        explanation:
          type: string
          maxLength: 20000
        option_weighted:
          type: boolean
          description: "`pg` only; then `correct` must be empty and every option may carry points."
        case_sensitive:
          type: boolean
          description: "`isian` only."
        options:
          type: array
          maxItems: 8
          description: |
            2–8 for the choice types, absent for `isian`, optional for `benar_salah` (the server fixes
            `benar`/`salah`).
          items:
            $ref: "#/components/schemas/QuestionOptionInput"
        correct:
          type: array
          maxItems: 10
          items:
            type: string

    UpdateQuestionRequest:
      type: object
      additionalProperties: false
      required: [program_id, subject_id, type, content, difficulty, base_version]
      properties:
        base_version:
          type: integer
          description: The version the editor started from; a mismatch answers `409`.
        program_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        content:
          type: string
          maxLength: 20000
        difficulty:
          type: string
          enum: [easy, medium, hard]
        explanation:
          type: string
          maxLength: 20000
        option_weighted:
          type: boolean
          description: "`pg` only; then `correct` must be empty and every option may carry points."
        case_sensitive:
          type: boolean
          description: "`isian` only."
        options:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/QuestionOptionInput"
        correct:
          type: array
          maxItems: 10
          items:
            type: string

    QuestionImportRowPreview:
      type: object
      additionalProperties: false
      required: [type, content, program, subject, difficulty]
      properties:
        type:
          type: string
          description: The type as the parser read it, lowercased.
        content:
          type: string
          description: The cell text, verbatim.
        program:
          type: string
          description: The program name as written in the row.
        subject:
          type: string
          description: The subject name as written in the row.
        difficulty:
          type: string
          description: The normalized difficulty, or the cell text when it is unknown.

    QuestionImportRowError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: The spreadsheet column the row failed on, e.g. `program` or `option_b`.
          example: program
        message:
          type: string
          description: Human-readable, Indonesian, the same copy the editor shows.

    QuestionImportRow:
      type: object
      additionalProperties: false
      required: [row, valid, errors]
      properties:
        row:
          type: integer
          description: The 1-based data row number; the header is not listed.
        valid:
          type: boolean
        errors:
          type: array
          description: Empty when the row is valid.
          items:
            $ref: "#/components/schemas/QuestionImportRowError"
        preview:
          $ref: "#/components/schemas/QuestionImportRowPreview"

    QuestionImportPreview:
      type: object
      additionalProperties: false
      required: [file_name, format, total, valid, invalid, rows]
      properties:
        file_name:
          type: string
        format:
          type: string
          enum: [xlsx, csv, docx]
        total:
          type: integer
          description: Every data row in the file, at most 500.
        valid:
          type: integer
        invalid:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/QuestionImportRow"

    QuestionImportCommit:
      type: object
      additionalProperties: false
      required: [created, already_imported, question_ids]
      properties:
        created:
          type: integer
          description: Questions this commit wrote.
        already_imported:
          type: integer
          description: Selected rows this tenant had already imported from the same file.
        question_ids:
          type: array
          description: The ids of the questions this commit created.
          items:
            type: string
            format: uuid

    TryoutSummary:
      type: object
      additionalProperties: false
      required: [id, program_id, title, description, scoring_mode, status, active_from, active_until,
                 explanation_release_at, randomize_questions, randomize_options, grace_seconds, revision, locked,
                 subtest_count, question_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        scoring_mode:
          type: string
          enum: [weighted, irt]
          description: D04 is open; only the mode is stored, never a weight.
        status:
          type: string
          enum: [draft, published]
        active_from:
          type: string
          format: date-time
          nullable: true
        active_until:
          type: string
          format: date-time
        explanation_release_at:
          type: string
          format: date-time
          nullable: true
        randomize_questions:
          type: boolean
        randomize_options:
          type: boolean
        grace_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: |
            D10: seconds after a subtest's deadline during which an answer is still admitted. Default 0. Read live
            by the runtime, so Admin may change it mid-exam through `PUT /tryouts/{id}/grace`.
        revision:
          type: integer
          description: Bumped by every save; `base_revision` is what a concurrent save fails on.
        locked:
          type: boolean
          description: True once `first_attempt_at` is set — every edit, delete, publish and unpublish then answers `409`.
        subtest_count:
          type: integer
        question_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Assignment:
      type: object
      additionalProperties: false
      required: [question_id, version_id, version, number, type, difficulty, content, position]
      properties:
        question_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
          description: The frozen version; it is never replaced by a later edit of the question.
        version:
          type: integer
        number:
          type: integer
          format: int64
          description: The question's human number (`seq`).
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        difficulty:
          type: string
          enum: [easy, medium, hard]
        content:
          type: string
          description: The frozen content, verbatim. Answer keys stay on the question API.
        position:
          type: integer

    Subtest:
      type: object
      additionalProperties: false
      required: [id, name, duration_seconds, position, questions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        duration_seconds:
          type: integer
          minimum: 60
          maximum: 28800
        position:
          type: integer
          description: Stored order, starting at 1.
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"

    Tryout:
      type: object
      additionalProperties: false
      required: [id, program_id, title, description, scoring_mode, status, active_from, active_until,
                 explanation_release_at, randomize_questions, randomize_options, grace_seconds, revision, locked,
                 subtest_count, question_count, created_at, updated_at, subtests]
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        scoring_mode:
          type: string
          enum: [weighted, irt]
        status:
          type: string
          enum: [draft, published]
        active_from:
          type: string
          format: date-time
          nullable: true
        active_until:
          type: string
          format: date-time
        explanation_release_at:
          type: string
          format: date-time
          nullable: true
        randomize_questions:
          type: boolean
        randomize_options:
          type: boolean
        grace_seconds:
          type: integer
          minimum: 0
          maximum: 3600
        revision:
          type: integer
        locked:
          type: boolean
        subtest_count:
          type: integer
        question_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        subtests:
          type: array
          items:
            $ref: "#/components/schemas/Subtest"

    TryoutList:
      type: object
      additionalProperties: false
      required: [tryouts, total]
      properties:
        tryouts:
          type: array
          description: Counts only — GET one tryout for its subtests and assignments.
          items:
            $ref: "#/components/schemas/TryoutSummary"
        total:
          type: integer
          description: Every tryout the filters match, not only the page returned.

    TryoutQuestionRequest:
      type: object
      additionalProperties: false
      required: [question_id]
      properties:
        question_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
          description: |
            Omit to assign the question's current version. A version this tryout already assigned to
            the question is kept; any other id answers `422` on this path.

    TryoutSubtestRequest:
      type: object
      additionalProperties: false
      required: [name, duration_seconds]
      properties:
        name:
          type: string
          maxLength: 200
        duration_seconds:
          type: integer
          minimum: 60
          maximum: 28800
        questions:
          type: array
          maxItems: 200
          description: Array order becomes `position`.
          items:
            $ref: "#/components/schemas/TryoutQuestionRequest"

    CreateTryoutRequest:
      type: object
      additionalProperties: false
      required: [program_id, title, scoring_mode, active_until]
      properties:
        program_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        scoring_mode:
          type: string
          enum: [weighted, irt]
        active_from:
          type: string
          format: date-time
          nullable: true
        active_until:
          type: string
          format: date-time
        explanation_release_at:
          type: string
          format: date-time
          nullable: true
        randomize_questions:
          type: boolean
        randomize_options:
          type: boolean
        grace_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: |
            Admin only: any other role's value is ignored. Omitted keeps the stored value (0 on create). Editable only
            while the tryout is unlocked; `PUT /tryouts/{id}/grace` works after the first attempt.
        subtests:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/TryoutSubtestRequest"

    UpdateTryoutRequest:
      type: object
      additionalProperties: false
      required: [program_id, title, scoring_mode, active_until, base_revision]
      properties:
        base_revision:
          type: integer
          description: The revision the builder opened; a mismatch answers `409`.
        program_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        scoring_mode:
          type: string
          enum: [weighted, irt]
        active_from:
          type: string
          format: date-time
          nullable: true
        active_until:
          type: string
          format: date-time
        explanation_release_at:
          type: string
          format: date-time
          nullable: true
        randomize_questions:
          type: boolean
        randomize_options:
          type: boolean
        grace_seconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: |
            Admin only: any other role's value is ignored. Omitted keeps the stored value (0 on create). Editable only
            while the tryout is unlocked; `PUT /tryouts/{id}/grace` works after the first attempt.
        subtests:
          type: array
          maxItems: 30
          description: The complete definition; subtests and assignments missing here are deleted.
          items:
            $ref: "#/components/schemas/TryoutSubtestRequest"

    ProductTryout:
      type: object
      additionalProperties: false
      required: [id, title, status, subtest_count, question_count]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [draft, published]
        subtest_count:
          type: integer
        question_count:
          type: integer

    Product:
      type: object
      additionalProperties: false
      required: [id, type, title, description, program_id, price, original_price, is_active, active_from, active_until,
                 tryouts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [individual, bundle]
        title:
          type: string
        description:
          type: string
        program_id:
          type: string
          format: uuid
        price:
          type: string
          description: Canonical decimal string with two fraction digits, for example `"150000.00"`. Never a float.
          example: "150000.00"
        original_price:
          type: string
          nullable: true
          description: The normal price when the product is discounted; never below `price`.
          example: "200000.00"
        is_active:
          type: boolean
        active_from:
          type: string
          format: date-time
          nullable: true
          description: First moment the product can be bought; `null` means no start. Never changes tryout access (D05a).
        active_until:
          type: string
          format: date-time
          nullable: true
        tryouts:
          type: array
          items:
            $ref: "#/components/schemas/ProductTryout"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductList:
      type: object
      additionalProperties: false
      required: [products, total]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer

    ProductRequest:
      type: object
      additionalProperties: false
      required: [type, title, description, program_id, price, original_price, is_active, tryout_ids]
      properties:
        type:
          type: string
          enum: [individual, bundle]
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        program_id:
          type: string
          format: uuid
        price:
          type: string
          description: Decimal string, at most two fraction digits, greater than zero. `1e3`, `NaN` and `-1` are refused.
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          example: "150000"
        original_price:
          type: string
          nullable: true
          description: Same grammar as `price` and never below it; `null` means no discount.
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
        is_active:
          type: boolean
        active_from:
          type: string
          format: date-time
          nullable: true
          description: |
            Optional. First moment the product can be bought. Must be before `active_until` when both are set,
            otherwise `422` on `active_from`. It bounds the catalog and checkout only; a tryout's own window
            decides when it can be taken.
        active_until:
          type: string
          format: date-time
          nullable: true
        tryout_ids:
          type: array
          description: The complete package, in order. One id for `individual`, two to twenty for `bundle`.
          items:
            type: string
            format: uuid

    PublicProductTryout:
      type: object
      additionalProperties: false
      required: [id, title, subtest_count, question_count, duration_seconds_total]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        subtest_count:
          type: integer
        question_count:
          type: integer
        duration_seconds_total:
          type: integer

    PublicProduct:
      type: object
      additionalProperties: false
      required: [id, type, title, description, program_id, program_code, program_name, price, original_price,
                 discount_percent, active_until, tryouts]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [individual, bundle]
        title:
          type: string
        description:
          type: string
        program_id:
          type: string
          format: uuid
        program_code:
          type: string
        program_name:
          type: string
        price:
          type: string
          description: Canonical decimal string; the client formats it for display and never divides it.
          example: "150000.00"
        original_price:
          type: string
          nullable: true
        discount_percent:
          type: integer
          nullable: true
          description: Rounded whole percent, computed by the server; `null` when there is no discount.
        active_until:
          type: string
          format: date-time
          nullable: true
        tryouts:
          type: array
          items:
            $ref: "#/components/schemas/PublicProductTryout"

    PublicProductList:
      type: object
      additionalProperties: false
      required: [products, total]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/PublicProduct"
        total:
          type: integer

    CatalogSummary:
      type: object
      additionalProperties: false
      required: [programs, products, tryouts]
      properties:
        programs:
          type: integer
        products:
          type: integer
        tryouts:
          type: integer

    Wallet:
      type: object
      additionalProperties: false
      required: [balance, total_credits, total_debits]
      properties:
        balance:
          type: string
          description: The projection, a canonical decimal string with exactly two fraction digits.
          example: "150000.00"
        total_credits:
          type: string
          description: Sum of the positive ledger amounts, computed in SQL.
          example: "200000.00"
        total_debits:
          type: string
          description: Sum of the magnitude of the negative ledger amounts, computed in SQL.
          example: "50000.00"

    WalletEntry:
      type: object
      additionalProperties: false
      required: [id, seq, kind, amount, balance_after, actor_kind, actor_name, reason, source_type, source_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          description: Total order of the ledger; entries are listed newest first by it.
        kind:
          type: string
          enum: [opening, topup, spend, adjustment]
        amount:
          type: string
          description: Signed canonical decimal — `"50000.00"` or `"-25000.00"` — never a number.
          example: "-25000.00"
        balance_after:
          type: string
          description: The projection just after this movement, never negative.
          example: "125000.00"
        actor_kind:
          type: string
          enum: [system, student, provider, staff, platform]
        actor_name:
          type: string
          nullable: true
          description: A staff member's display name only, never their email or phone; null otherwise.
        reason:
          type: string
          description: Required for an adjustment, empty for every other kind.
        source_type:
          type: string
          description: The business source, for example `adjustment` or `order`.
        source_id:
          type: string
          description: Unique within the tenant together with `source_type`; the idempotency key for an adjustment.
        created_at:
          type: string
          format: date-time

    WalletEntryList:
      type: object
      additionalProperties: false
      required: [entries, total]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WalletEntry"
        total:
          type: integer

    WalletStudent:
      type: object
      additionalProperties: false
      required: [id, name, email, phone, balance, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        balance:
          type: string
          description: The student's projection, a canonical decimal string.
          example: "150000.00"
        created_at:
          type: string
          format: date-time

    WalletStudentList:
      type: object
      additionalProperties: false
      required: [students, total]
      properties:
        students:
          type: array
          items:
            $ref: "#/components/schemas/WalletStudent"
        total:
          type: integer

    AdjustmentRequest:
      type: object
      additionalProperties: false
      required: [type, amount, reason, idempotency_key]
      properties:
        type:
          type: string
          enum: [credit, debit]
          description: The direction; the server signs the amount, so `amount` itself is unsigned.
        amount:
          type: string
          description: A plain decimal above zero with at most two fraction digits, for example `"50000.00"`.
          example: "50000.00"
        reason:
          type: string
          description: Required, trimmed; an empty or blank reason answers `422 reason`.
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: Identifies the financial operation; a retry with the same key moves money once.

    AdjustmentResult:
      type: object
      additionalProperties: false
      required: [entry, balance]
      properties:
        entry:
          $ref: "#/components/schemas/WalletEntry"
        balance:
          type: string
          description: The projection after the adjustment, a canonical decimal string.
          example: "50000.00"

    Asset:
      type: object
      required: [id, purpose, content_type, size_bytes, status]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [question_image, payment_proof, item_image]
        content_type:
          type: string
          description: The type detected from the bytes, never the client's.
          enum: [image/png, image/jpeg, image/webp]
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 5242880
        status:
          type: string
          enum: [staged, final]

    AssetURL:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: A presigned GET; it carries its own credentials, so never log or store it.
        expires_at:
          type: string
          format: date-time

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier. Switch on this, never on `message`.
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - validation_failed
                - payload_too_large
                - too_many_requests
                - internal_error
                - service_unavailable
                - already_owned
                - insufficient_balance
                - price_changed
                - order_pending
                - tryout_not_open
                - tryout_closed
                - session_completed
                - subtest_not_running
                - deadline_passed
                - stale_answer
                - subtest_order
                - result_not_ready
                - explanations_not_released
                - package_in_use
                - package_too_small
            message:
              type: string
              description: Human-readable, Indonesian, safe to show to end users.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Present on validation_failed — maps field name to reason.
            request_id:
              type: string
              description: Correlates with the server log line for this request.

    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [product_id, payment_method, idempotency_key, expected_price]
      properties:
        product_id:
          type: string
          format: uuid
        expected_price:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          description: The price the page showed, as the same decimal string `Product.price` uses.
        payment_method:
          type: string
          enum: [manual, wallet]
        idempotency_key:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
        proof_asset_id:
          type: string
          format: uuid
          nullable: true
          description: Required for `manual` and refused for `wallet`. An unused `payment_proof` asset the caller uploaded.

    CancelOrderRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    OrderItem:
      type: object
      additionalProperties: false
      required: [tryout_id, title]
      properties:
        tryout_id:
          type: string
          format: uuid
        title:
          type: string
          description: The tryout's title when the order was placed.

    Order:
      type: object
      additionalProperties: false
      required: [id, code, status, payment_method, student_id, student_name, product_id, product_type, product_title,
                 price, items, proof_asset_id, cancel_reason, created_at, confirmed_at, cancelled_at]
      description: The checkout snapshot. Editing or deleting the product later changes nothing here.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: ORD-000042
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        payment_method:
          type: string
          enum: [manual, wallet]
        student_id:
          type: string
          format: uuid
        student_name:
          type: string
        product_id:
          type: string
          format: uuid
        product_type:
          type: string
          enum: [individual, bundle]
        product_title:
          type: string
        price:
          type: string
          description: Canonical decimal string with two fraction digits, exactly what was charged or to be transferred.
          example: "150000.00"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        proof_asset_id:
          type: string
          format: uuid
          nullable: true
          description: The transfer proof of a `manual` order; read it with `GET /api/v1/assets/{id}/url`.
        cancel_reason:
          type: string
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true

    OrderList:
      type: object
      additionalProperties: false
      required: [orders, total]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer

    Enrollment:
      type: object
      additionalProperties: false
      required: [id, tryout_id, tryout_title, program_code, program_name, subtest_count, active_from, active_until,
                 created_at]
      properties:
        id:
          type: string
          format: uuid
        tryout_id:
          type: string
          format: uuid
        tryout_title:
          type: string
        program_code:
          type: string
        program_name:
          type: string
        subtest_count:
          type: integer
        active_from:
          type: string
          format: date-time
          nullable: true
          description: The tryout's own start; access has not begun before it.
        active_until:
          type: string
          format: date-time
          description: The tryout's own end (D05a).
        created_at:
          type: string
          format: date-time

    EnrollmentList:
      type: object
      additionalProperties: false
      required: [enrollments]
      properties:
        enrollments:
          type: array
          items:
            $ref: "#/components/schemas/Enrollment"

    BankTransfer:
      type: object
      additionalProperties: false
      required: [bank_name, account_number, account_holder]
      properties:
        bank_name:
          type: string
        account_number:
          type: string
        account_holder:
          type: string

    GraceRequest:
      type: object
      additionalProperties: false
      required: [grace_seconds]
      properties:
        grace_seconds:
          type: integer
          minimum: 0
          maximum: 3600

    Settings:
      type: object
      additionalProperties: false
      required: [scoring_weights]
      properties:
        scoring_weights:
          type: object
          additionalProperties: false
          required: [easy, medium, hard]
          properties:
            easy:
              type: number
              description: Points of a correctly answered easy question.
            medium:
              type: number
            hard:
              type: number

    RuntimeSubtestState:
      type: object
      additionalProperties: false
      required: [subtest_id, name, position, duration_seconds, question_count, status, started_at,
                 deadline_at, submitted_at, score, correct_count]
      properties:
        subtest_id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        duration_seconds:
          type: integer
        question_count:
          type: integer
        status:
          type: string
          enum: [pending, running, submitted]
        started_at:
          type: string
          format: date-time
          nullable: true
        deadline_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When the countdown ends: the earlier of start + duration and `active_until`, plus the tryout's grace
            (read live, so it can move between syncs) and this subtest's staff extension. Null until the subtest starts. Compare it with `server_time`, never with the device clock.
        submitted_at:
          type: string
          format: date-time
          nullable: true
        score:
          type: number
          nullable: true
          description: 0-100; only once the session is completed.
        correct_count:
          type: integer
          nullable: true
          description: Only once the session is completed.

    TryoutResultSubtest:
      type: object
      additionalProperties: false
      required: [subtest_id, name, position, score, correct_count, question_count]
      properties:
        subtest_id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        score:
          type: number
          description: (earned / maximum) x 100 of this subtest, 2 decimals. A subtest never started scores 0.
        correct_count:
          type: integer
        question_count:
          type: integer

    TryoutResult:
      type: object
      additionalProperties: false
      required: [session_id, tryout_id, attempt_number, score, scoring_mode, scoring_version, completed_at, subtests]
      properties:
        session_id:
          type: string
          format: uuid
        tryout_id:
          type: string
          format: uuid
        attempt_number:
          type: integer
        score:
          type: number
          description: (earned points / maximum points) x 100 rounded to 2 decimals (D04), out of 100.
        scoring_mode:
          type: string
          enum: [weighted, irt]
          description: IRT keeps weighted scoring; no model is fitted.
        scoring_version:
          type: integer
          description: Stored with the result so a later policy never rewrites it.
        completed_at:
          type: string
          format: date-time
        subtests:
          type: array
          items:
            $ref: "#/components/schemas/TryoutResultSubtest"

    TryoutRanking:
      type: object
      additionalProperties: false
      required: [rank, participant_count, average_score, attempts_counted]
      description: The student's current place on the tryout; never stored, so never stale.
      properties:
        rank:
          type: integer
          description: 1-based competition rank; equal averages share it and the next rank skips.
        participant_count:
          type: integer
        average_score:
          type: number
          description: Mean of the student's completed-attempt scores, 2 decimals.
        attempts_counted:
          type: integer

    TryoutResultDetail:
      type: object
      additionalProperties: false
      description: A `TryoutResult` plus the current rank and the explanation release.
      required: [session_id, tryout_id, attempt_number, score, scoring_mode, scoring_version, completed_at, subtests,
                 ranking, explanations_released, explanation_release_at]
      properties:
        session_id:
          type: string
          format: uuid
        tryout_id:
          type: string
          format: uuid
        attempt_number:
          type: integer
        score:
          type: number
        scoring_mode:
          type: string
          enum: [weighted, irt]
        scoring_version:
          type: integer
        completed_at:
          type: string
          format: date-time
        subtests:
          type: array
          items:
            $ref: "#/components/schemas/TryoutResultSubtest"
        ranking:
          $ref: "#/components/schemas/TryoutRanking"
        explanations_released:
          type: boolean
        explanation_release_at:
          type: string
          format: date-time
          nullable: true

    ReviewOption:
      type: object
      additionalProperties: false
      required: [id, label, points]
      properties:
        id:
          type: string
        label:
          type: string
        points:
          type: number
          nullable: true
          description: Only on an option-weighted question.

    ReviewQuestion:
      type: object
      additionalProperties: false
      required: [id, position, type, content, options, option_weighted, answer, correct, is_correct, explanation]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        content:
          type: string
        options:
          type: array
          description: In the order this student saw them.
          items:
            $ref: "#/components/schemas/ReviewOption"
        option_weighted:
          type: boolean
        answer:
          type: array
          description: The student's saved answer; empty when the question was left blank.
          items:
            type: string
        correct:
          type: array
          description: The key. Empty for an option-weighted question.
          items:
            type: string
        is_correct:
          type: boolean
        explanation:
          type: string

    ReviewSubtest:
      type: object
      additionalProperties: false
      required: [subtest_id, name, position, score, correct_count, question_count, questions]
      properties:
        subtest_id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        score:
          type: number
        correct_count:
          type: integer
        question_count:
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/ReviewQuestion"

    TryoutReview:
      type: object
      additionalProperties: false
      required: [session_id, tryout_id, subtests]
      properties:
        session_id:
          type: string
          format: uuid
        tryout_id:
          type: string
          format: uuid
        subtests:
          type: array
          items:
            $ref: "#/components/schemas/ReviewSubtest"

    LeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, user_id, student_name, average_score, attempts_counted]
      properties:
        rank:
          type: integer
        user_id:
          type: string
          format: uuid
        student_name:
          type: string
        average_score:
          type: number
        attempts_counted:
          type: integer

    Leaderboard:
      type: object
      additionalProperties: false
      required: [entries, total]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        total:
          type: integer
          description: Participants of the tryout.

    StaffResultSubtest:
      type: object
      additionalProperties: false
      required: [subtest_id, name, position, score, correct_count, question_count]
      properties:
        subtest_id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        score:
          type: number
        correct_count:
          type: integer
        question_count:
          type: integer

    ViolationType:
      type: string
      enum: [exit_fullscreen, screenshot_attempt]

    ViolationRequest:
      type: object
      additionalProperties: false
      required: [event_id, type]
      properties:
        event_id:
          type: string
          format: uuid
          description: Chosen by the browser per event and reused on every retry of it.
        type:
          $ref: "#/components/schemas/ViolationType"
        subtest_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The subtest the browser was in, so a late retry keeps its original attribution. Used only when it is a
            subtest of this session; otherwise the running subtest is recorded.

    Violation:
      type: object
      additionalProperties: false
      required: [id, session_id, subtest_id, subtest_name, type, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        subtest_id:
          type: string
          format: uuid
          description: The subtest that was running when it happened.
        subtest_name:
          type: string
        type:
          $ref: "#/components/schemas/ViolationType"
        occurred_at:
          type: string
          format: date-time
          description: The server's clock.

    ActiveSubtest:
      type: object
      additionalProperties: false
      required: [subtest_id, name, position, started_at]
      properties:
        subtest_id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        started_at:
          type: string
          format: date-time

    ActiveSession:
      type: object
      additionalProperties: false
      required: [session_id, user_id, student_name, tryout_id, tryout_title, attempt_number, started_at, subtest,
                 violation_count]
      properties:
        session_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        student_name:
          type: string
        tryout_id:
          type: string
          format: uuid
        tryout_title:
          type: string
        attempt_number:
          type: integer
        started_at:
          type: string
          format: date-time
        subtest:
          allOf:
            - $ref: "#/components/schemas/ActiveSubtest"
          nullable: true
        violation_count:
          type: integer

    ActiveSessionList:
      type: object
      additionalProperties: false
      required: [sessions, total, server_time]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ActiveSession"
        total:
          type: integer
          description: Every in-progress session of the tenant, not only this page.
        server_time:
          type: string
          format: date-time

    ViolationTimeline:
      type: object
      additionalProperties: false
      required: [session_id, user_id, student_name, tryout_id, tryout_title, attempt_number, status, started_at,
                 completed_at, total, violations]
      properties:
        session_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        student_name:
          type: string
        tryout_id:
          type: string
          format: uuid
        tryout_title:
          type: string
        attempt_number:
          type: integer
        status:
          type: string
          enum: [in_progress, completed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        total:
          type: integer
        violations:
          type: array
          items:
            $ref: "#/components/schemas/Violation"

    StaffResult:
      type: object
      additionalProperties: false
      required: [session_id, tryout_id, tryout_title, program_code, scoring_mode, user_id, student_name,
                 attempt_number, score, average_score, rank, participant_count, irt_warning, completed_at, subtests]
      properties:
        session_id:
          type: string
          format: uuid
        tryout_id:
          type: string
          format: uuid
        tryout_title:
          type: string
        program_code:
          type: string
        scoring_mode:
          type: string
          enum: [weighted, irt]
        user_id:
          type: string
          format: uuid
        student_name:
          type: string
        attempt_number:
          type: integer
        score:
          type: number
          description: This attempt's score out of 100.
        average_score:
          type: number
          description: The student's average over completed attempts of this tryout, which ranks them.
        rank:
          type: integer
          description: The student's current rank, not a rank frozen at completion.
        participant_count:
          type: integer
        irt_warning:
          type: boolean
        completed_at:
          type: string
          format: date-time
        subtests:
          type: array
          items:
            $ref: "#/components/schemas/StaffResultSubtest"

    StaffResultList:
      type: object
      additionalProperties: false
      required: [results, total]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/StaffResult"
        total:
          type: integer

    TryoutSession:
      type: object
      additionalProperties: false
      required: [id, tryout_id, tryout_title, attempt_number, status, started_at, completed_at, active_until,
                 server_time, subtests, result]
      properties:
        id:
          type: string
          format: uuid
        tryout_id:
          type: string
          format: uuid
        tryout_title:
          type: string
        attempt_number:
          type: integer
        status:
          type: string
          enum: [in_progress, completed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        active_until:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
          description: The server clock at this response; the browser adds monotonic elapsed time to it.
        subtests:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeSubtestState"
        result:
          allOf:
            - $ref: "#/components/schemas/TryoutResult"
          nullable: true
          description: Present once completed, including on the response that completed it.

    AttemptSummary:
      type: object
      additionalProperties: false
      required: [session_id, tryout_id, attempt_number, status, started_at, completed_at, score]
      properties:
        session_id:
          type: string
          format: uuid
        tryout_id:
          type: string
          format: uuid
        attempt_number:
          type: integer
        status:
          type: string
          enum: [in_progress, completed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        score:
          type: number
          nullable: true

    AttemptList:
      type: object
      additionalProperties: false
      required: [attempts]
      properties:
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/AttemptSummary"

    StudentTryoutSubtest:
      type: object
      additionalProperties: false
      required: [id, name, duration_seconds, position, question_count]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        duration_seconds:
          type: integer
        position:
          type: integer
        question_count:
          type: integer

    StudentTryout:
      type: object
      additionalProperties: false
      required: [id, title, description, scoring_mode, program_code, program_name, active_from, active_until,
                 subtests, current, attempts]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        scoring_mode:
          type: string
          enum: [weighted, irt]
        program_code:
          type: string
        program_name:
          type: string
        active_from:
          type: string
          format: date-time
          nullable: true
        active_until:
          type: string
          format: date-time
        subtests:
          type: array
          items:
            $ref: "#/components/schemas/StudentTryoutSubtest"
        current:
          allOf:
            - $ref: "#/components/schemas/TryoutSession"
          nullable: true
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/AttemptSummary"

    RuntimeOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          description: Stable across shuffles and attempts; answers refer to it.
        label:
          type: string

    RuntimeQuestion:
      type: object
      additionalProperties: false
      required: [id, position, type, content, options, answer, revision, seq]
      description: |
        A question as a student may see it: no key, no option points, no explanation, no version id.
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          description: 1-based position in this session's order.
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        content:
          type: string
        options:
          type: array
          description: In this session's order; empty for `isian`.
          items:
            $ref: "#/components/schemas/RuntimeOption"
        answer:
          type: array
          description: The accepted answer, as option ids or the typed text for `isian`. Empty when none.
          items:
            type: string
        revision:
          type: integer
          description: Server revision of the accepted answer; 0 when none was saved.
        seq:
          type: integer
          format: int64
          description: The client sequence of the accepted answer; 0 when none was saved. The next write uses a larger one.

    RuntimeSubtest:
      type: object
      additionalProperties: false
      required: [session_id, subtest, server_time, questions]
      properties:
        session_id:
          type: string
          format: uuid
        subtest:
          $ref: "#/components/schemas/RuntimeSubtestState"
        server_time:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeQuestion"

    AnswerRequest:
      type: object
      additionalProperties: false
      required: [seq, answer]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: The client's per-question counter; it only grows and a retry resends the same value.
        answer:
          type: array
          description: |
            `pg` and `benar_salah`: at most one option id. `pg_multi`: distinct option ids. `isian`: at most one
            text of 500 characters. Empty clears the question.
          items:
            type: string

    AnswerAck:
      type: object
      additionalProperties: false
      required: [question_id, revision, seq, server_time]
      properties:
        question_id:
          type: string
          format: uuid
        revision:
          type: integer
        seq:
          type: integer
          format: int64
        server_time:
          type: string
          format: date-time

    ExtensionRequest:
      type: object
      additionalProperties: false
      required: [seconds, reason]
      properties:
        seconds:
          type: integer
          minimum: 1
          maximum: 14400
        reason:
          type: string
          maxLength: 500

    Extension:
      type: object
      additionalProperties: false
      required: [session_id, subtest_id, seconds, total_seconds]
      properties:
        session_id:
          type: string
          format: uuid
        subtest_id:
          type: string
          format: uuid
          description: The subtest that was running and received the grant.
        seconds:
          type: integer
        total_seconds:
          type: integer
          description: Every grant of that subtest summed; capped at 28800.

    ItemPackageType:
      type: string
      enum: [symbol, image, emoji, shape]

    ItemPackage:
      type: object
      additionalProperties: false
      required: [id, type, name, revision, element_count, required_count, in_use, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ItemPackageType"
        name:
          type: string
          minLength: 1
          maxLength: 100
        revision:
          type: integer
          minimum: 1
          description: The current frozen revision. Every content change writes the next one.
        element_count:
          type: integer
          minimum: 0
          maximum: 500
          description: Elements in the current revision.
        required_count:
          type: integer
          minimum: 0
          description: The largest pool size any referencing test needs; 0 when no test uses the package.
        in_use:
          type: boolean
          description: True when a test pins the package; it cannot be deleted then.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ItemPackageList:
      type: object
      additionalProperties: false
      required: [packages]
      properties:
        packages:
          type: array
          items:
            $ref: "#/components/schemas/ItemPackage"

    CreateItemPackageRequest:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          $ref: "#/components/schemas/ItemPackageType"
        name:
          type: string
          minLength: 1
          maxLength: 100

    RenameItemPackageRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    ItemElement:
      type: object
      additionalProperties: false
      required: [id, position, kind, value, label]
      properties:
        id:
          type: string
          format: uuid
          description: Stable across revisions.
        position:
          type: integer
          minimum: 0
        kind:
          $ref: "#/components/schemas/ItemPackageType"
        value:
          type: string
          description: |
            The symbol itself, the emoji id (its hex codepoint; the picture is `/emoji/{value}.svg`) or the
            shape id. Empty for an image.
        label:
          type: string
          description: Dashboard label only (an image's file name, a catalog name); never shown to a student.
        asset_id:
          type: string
          format: uuid
          description: Image elements only. Fetch a download link with `GET /api/v1/assets/{id}/url`.

    ItemPackageDetail:
      type: object
      additionalProperties: false
      required: [package, revision, elements]
      properties:
        package:
          $ref: "#/components/schemas/ItemPackage"
        revision:
          type: integer
          minimum: 1
          description: The revision `elements` belongs to; the package's own `revision` is its current one.
        elements:
          type: array
          items:
            $ref: "#/components/schemas/ItemElement"

    ItemElementsUpload:
      type: object
      additionalProperties: false
      properties:
        symbols:
          type: string
          description: Symbol packages. Typed or pasted symbols separated by spaces or new lines.
        file:
          type: string
          format: binary
          description: Symbol packages. One `.csv`, `.txt` or `.xlsx` column.
        files:
          type: array
          description: Image packages. PNG, JPEG, WebP or `.zip` files.
          items:
            type: string
            format: binary
        ids:
          type: array
          description: Emoji and shape packages. Catalog ids.
          items:
            type: string

    ItemElementCheck:
      type: object
      additionalProperties: false
      required: [label, kind, accepted]
      properties:
        label:
          type: string
          description: The symbol, an image's base name, or a catalog name.
        kind:
          $ref: "#/components/schemas/ItemPackageType"
        accepted:
          type: boolean
        reason:
          type: string
          description: Present when rejected.
          enum:
            - duplicate
            - duplicate_in_upload
            - emoji_in_symbol
            - symbol_multi
            - symbol_invalid
            - image_type
            - image_too_large
            - image_corrupt
            - image_dimensions
            - path_traversal
            - symlink
            - nested_archive
            - archive_corrupt
            - archive_too_large
            - archive_too_many_files
            - archive_extracted_too_large
            - not_in_catalog
            - package_full
        message:
          type: string
          description: Indonesian explanation of `reason`, with guidance, safe to show.

    ItemElementPreview:
      type: object
      additionalProperties: false
      required: [accepted, rejected, items]
      properties:
        accepted:
          type: integer
        rejected:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemElementCheck"

    ItemElementCommit:
      type: object
      additionalProperties: false
      required: [added, already_present, rejected, revision]
      properties:
        added:
          type: integer
          description: Elements this commit wrote; 0 means no revision was written.
        already_present:
          type: integer
          description: Duplicates of what the package already held or repeated within the upload.
        rejected:
          type: integer
          description: Elements rejected for any other reason; they were not written.
        revision:
          type: integer
          minimum: 1
          description: The package's current revision after this call.

    EmojiCatalogItem:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          description: Lowercase hex codepoint; the bundled picture is `/emoji/{id}.svg`.
        name:
          type: string

    ShapeCatalogItem:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          enum: [kotak, segitiga, persegi_panjang, lingkaran, jajar_genjang, trapesium, belah_ketupat]
        name:
          type: string

    ItemCatalog:
      type: object
      additionalProperties: false
      required: [emoji, emoji_attribution, shapes, symbol_palette]
      properties:
        emoji:
          type: array
          items:
            $ref: "#/components/schemas/EmojiCatalogItem"
        emoji_attribution:
          type: string
          description: The Twemoji CC-BY 4.0 credit to show wherever the emoji catalog is used.
        shapes:
          type: array
          items:
            $ref: "#/components/schemas/ShapeCatalogItem"
        symbol_palette:
          type: array
          items:
            type: string

    SampleColumnRequest:
      type: object
      additionalProperties: false
      required: [item_length, options_per_soal, soal_per_kolom]
      properties:
        item_length:
          type: integer
          minimum: 1
          maximum: 5
        options_per_soal:
          type: integer
          minimum: 2
        soal_per_kolom:
          type: integer
          minimum: 1
          maximum: 100

    SampleItem:
      type: object
      additionalProperties: false
      required: [elements]
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/ItemElement"

    SampleSoal:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SampleItem"

    SampleColumn:
      type: object
      additionalProperties: false
      required: [soal]
      properties:
        soal:
          type: array
          items:
            $ref: "#/components/schemas/SampleSoal"

  parameters:
    ItemPackageId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubtestId:
      name: subtestId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: No usable identity on the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The request is understood but not allowed, for example a rejected Origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: The request body is missing a field or is not the expected shape
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The configured tenant is missing or inactive, or the resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds
      headers:
        Retry-After:
          description: Whole seconds until the current window ends.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: The request body is larger than the upload limit (5 MB plus multipart framing)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request conflicts with the resource's current state, for example a reused idempotency key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: A dependency this route needs, such as object storage, is not configured or reachable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
