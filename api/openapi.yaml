openapi: 3.0.3
info:
  title: Taruna Eduka — Tryout Platform API
  version: 0.1.0
  description: |
    Source of truth for the HTTP contract. The typed TypeScript client consumed by `web/`
    is generated from this file, so a breaking change here surfaces as a compile error in
    the frontend rather than a runtime surprise.

    Scope today is slices P00–P05. Later slices extend this file; they do not fork it.
    Every `/api/v1/*` route resolves its tenant from the request host first, and the access token
    has to agree with that host, so a token minted for one tenant is refused everywhere else.
    P03a and P03b ship the API and the generated types only — the auth screens are P03c.

    Emails and phones are stored in one canonical form: a trimmed, lowercased email and an E.164
    phone (`0812…`, `62812…` and `+62 812-…` all become `+62812…`). Every route that takes an
    identifier normalizes it first, so any of those spellings reaches the same account.

servers:
  - url: http://localhost:8081
    description: Local development

tags:
  - name: system
    description: Liveness and readiness probes
  - name: tenant
    description: Public tenant lookup by request host
  - name: auth
    description: Sessions, tokens and the authenticated principal
  - name: programs
    description: Tenant curriculum — programs, subjects and chapters
  - name: questions
    description: Tenant question bank — four types, immutable versions

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: Reports process health only. Does not touch the database by design.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: |
        Reports whether this instance can serve traffic, including database reachability.

        The 503 body is this endpoint's own shape — `{status, reason}` — and deliberately
        not the error envelope.
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status:
                    type: string
                    example: unavailable
                  reason:
                    type: string
                    example: database unreachable

  /api/v1/tenant:
    get:
      tags: [tenant]
      summary: Tenant for the request host
      description: |
        Resolves the tenant from the request host: `<slug>.<BASE_DOMAIN>` selects a tenant.

        An active tenant's slug and display name are public — the landing page needs them.
        An inactive, unknown, reserved, malformed or platform host answers the same `404`
        with the same code and message, so those cases cannot be told apart from outside.
      responses:
        "200":
          description: The tenant the request host resolves to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for an access token
      description: |
        `identifier` matches either the email or the phone column, but only inside the tenant the
        request host resolves to, so the same email in two tenants is two different people.

        Unknown identifier, inactive account and wrong password all answer the same `401` with the
        same message, and an account that does not exist costs the same password comparison as one
        that does. A password longer than 72 bytes is refused the same way, because bcrypt ignores
        everything past that.

        Attempts are counted per identifier and host before the password is checked: the 11th
        attempt within 15 minutes answers `429` with `Retry-After`, even with the right password.
        A successful login, or a password reset, clears the count.

        On success the refresh token is set as an `HttpOnly` cookie scoped to `/api/v1/auth` and is
        never part of the body. This route needs no `Origin`: it is authenticated by credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A session was opened
          headers:
            Set-Cookie:
              description: |
                `refresh_token=<opaque>; Path=/api/v1/auth; HttpOnly; SameSite=Lax; Max-Age=2592000`,
                plus `Secure` outside development.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Issue a new access token from the refresh cookie
      description: |
        Reads the refresh cookie, which must name a live session of this host's tenant. Idle time is
        enforced here: the server expires a session that has had no authenticated request for three
        hours. Refreshing is not activity, so it does not move that deadline — only an authenticated
        request on `/me` (or any later protected route) does.

        Every refresh rotates the token and sets the new one in the cookie. The replaced token keeps
        working for 30 seconds, so two tabs that refresh at once both succeed; such a response sets
        no cookie, because the winning refresh already set it. Presented after those 30 seconds, a
        replaced token can only be a copy, so the whole session is revoked and the current token
        stops working too.

        The refresh token never appears in the body. A request is refused with `403` unless its
        `Origin` is both accepted by the CORS policy and on the host this request resolved to. A
        token that can never work again also clears the cookie.
      responses:
        "200":
          description: A fresh access token for the same session
          headers:
            Set-Cookie:
              description: The rotated `refresh_token`; absent on a refresh inside the 30-second grace.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the session behind the refresh cookie
      description: |
        Revocation takes effect on the very next request: the access token is refused immediately,
        because every request re-reads the session row. Always answers `204` and always clears the
        cookie, so a retry, a stale token or no token at all is not an error to the client.

        Like refresh, this route requires an `Origin` that is both CORS-accepted and on this
        request's host.
      responses:
        "204":
          description: The session is gone; the cookie is cleared with `Max-Age=0`
          headers:
            Set-Cookie:
              description: "`refresh_token=; Path=/api/v1/auth; HttpOnly; SameSite=Lax; Max-Age=0`"
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create a student account and open its session
      description: |
        D01: email is required and the phone is optional; both must be free in this tenant, and an
        account counts as holding them from the moment it is created, verified or not. The account
        exists at once and the answer is exactly a login's: a token body and the refresh cookie.

        A 6-digit code is emailed to verify the address. Verification never blocks a login; the web
        app reads `user.email_verified` and shows an alert until it is true. Someone who signed up
        with an address that is not theirs is undone by the real owner's password reset, which also
        verifies the email.

        At most 5 codes go to one email per hour across this route and `/me/email/resend`.
        Registration exists only on tenant hosts; the platform host answers `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account exists and a session is open
          headers:
            Set-Cookie:
              description: The `refresh_token` cookie, as on login.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An account already holds the email (`fields.email`) or the phone (`fields.phone`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      summary: Email a password reset link
      description: |
        FR-AUTH-03. Answers `202` with no body for every well-formed email, whether or not an account
        on this host has it, so the answer reveals nothing. A matching active account gets a link to
        `/reset-password#token=…` on this host's web app. The token is signed and bound to the
        current password: it works for 30 minutes, and the first password change — through any link —
        ends every outstanding link. The limit is 3 requests per email per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: A link is on its way if the email belongs to an account here
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      description: |
        Sets the password, revokes every session of the account and marks its email verified, since
        following the emailed link proves the inbox. A forged, used, expired or other-host token
        answers `422` with `fields.token`. The user logs in again afterwards; no session is opened here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: The password is changed and every session is ended
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/email/verify:
    post:
      tags: [auth]
      summary: Verify the signed-in user's email with the emailed code
      description: |
        A code works for 10 minutes and 5 guesses; wrong guesses are counted even under concurrent
        requests. A wrong, expired, used-up or missing code answers `422` with `fields.code`.
        Verifying an already verified email is a `204` too.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "204":
          description: The email is verified
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/email/resend:
    post:
      tags: [auth]
      summary: Email the signed-in user a fresh verification code
      description: |
        Replaces the outstanding code and restores its 5 guesses. Within 60 seconds of the last
        code, or past 5 codes in an hour, this answers `429`. An already verified email answers `409`.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: A code is on its way
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The email is already verified, or the account has no email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me:
    get:
      tags: [auth]
      summary: The authenticated principal
      description: |
        Returns the caller the server rebuilt from the access token, the session row and the user
        row — not from the token alone. A revoked session, a role change or a deactivated account
        invalidates an old token on the next request. Balance and the ledger are not part of
        identity and are not published here.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/programs:
    get:
      tags: [programs]
      summary: The tenant's program tree
      description: |
        FR-ADM-PRG-02: the hierarchy the question and tryout dropdowns read. Programs come back in
        their stored order, each with its subjects and their chapters in position order.

        Admin and Operator may read it; a Student answers `403`. The tree is always the tenant the
        request host resolves to — this slice has no master content and no copy-to-own.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every program of this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [programs]
      summary: Create a program with optional subjects and chapters
      description: |
        Admin only (FR-ADM-PRG-01). `code` is trimmed and uppercased, then must be 2–12 characters
        of `A-Z`, `0-9`, `_` or `-`; it is unique per tenant, so another tenant may use the same
        code. Subject and chapter names are trimmed, 1–100 characters, and unique among their
        siblings without regard to case. At most 50 subjects and 200 chapters per subject.

        Positions follow the order of the arrays. A duplicate code answers `409` with
        `fields.code`; a rule violation answers `422` with the failing field's path.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgramRequest"
      responses:
        "201":
          description: The program as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The code is already used in this tenant (`fields.code`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/programs/{id}:
    put:
      tags: [programs]
      summary: Replace a program's tree
      description: |
        Admin only. REPLACE semantics in one transaction with the program row locked: an item with an
        `id` is updated, an item without one is created, and an existing item the body no longer
        names is deleted. Positions are rewritten from the order of the arrays; the ids of kept items
        never change. Chapter ids are checked against this program, so a chapter may move to another
        of its own subjects but never to another program or tenant.

        An `id` that belongs to another program answers `422` naming its path (for example
        `subjects[1].id`). A program id of another tenant answers `404`, never `403`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgramRequest"
      responses:
        "200":
          description: The tree as stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The code is already used in this tenant (`fields.code`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [programs]
      summary: Delete a program and its tree
      description: |
        Admin only. Chapters, then subjects, then the program are removed in one transaction. Nothing
        is ever deleted implicitly: if a chapter or subject is still referenced (questions and
        tryouts will do that from later slices), the database refuses and the whole delete rolls
        back, answering `409`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The program and its tree are gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The program, a subject or a chapter is still referenced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/questions:
    get:
      tags: [questions]
      summary: The tenant's question bank
      description: |
        FR-ADM-SOA-01/05: Admin and Operator read the bank; a Student answers `403`, because an answer
        key never leaves the staff API. Questions come back newest first (`number` descending), at most
        100 per page, with `total` counting every question the filters match.

        `q` is a case-insensitive substring of the content, and `%` or `_` in it match themselves.
      security:
        - bearerAuth: []
      parameters:
        - name: program_id
          in: query
          schema:
            type: string
            format: uuid
        - name: subject_id
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            type: string
            enum: [pg, pg_multi, isian, benar_salah]
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [easy, medium, hard]
        - name: q
          in: query
          description: Case-insensitive substring of the content; `%` and `_` are literal.
          schema:
            type: string
        - name: limit
          in: query
          description: Defaults to 50, at most 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of this tenant's questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [questions]
      summary: Create a question
      description: |
        Admin and Operator may write tenant content. Version 1 is created with the question, and its
        option ids are assigned by the server; the client may send a placeholder id such as `a` in
        `options[].id` and name it in `correct`, and the server answers with the real ids.

        `pg` takes 2–8 options and exactly one correct id; with `option_weighted` every option is valid
        instead and `correct` must be empty, each option carrying 0–100 points (at most 2 decimals).
        `pg_multi` takes 2–8 options and at least two correct ids, all-or-nothing at scoring time.
        `isian` takes no options and 1–10 accepted answers. `benar_salah` has the server's fixed
        `benar`/`salah` options and exactly one of them as the answer.

        Content is stored verbatim as text: markdown and LaTeX render in the client, no HTML is
        interpreted, and a `data:` or `javascript:` image URL answers `422` because images are deferred.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "201":
          description: The question as stored, at version 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/questions/{id}:
    get:
      tags: [questions]
      summary: One question of this tenant
      description: |
        A question id of another tenant answers `404`, never `403`, so an id reveals nothing.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The question at its current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [questions]
      summary: Save a new version of a question
      description: |
        Editing never rewrites what a tryout already used: when the normalized payload differs from
        the current version, a new immutable version is appended and the head row moves to it, in one
        transaction with that row locked. A payload identical to the current version answers `200` with
        the same version and writes nothing.

        `base_version` is the version the editor started from. If someone else has saved since, it no
        longer matches and the answer is `409`; the editor must reload rather than overwrite. An option
        id that belongs to this question keeps it, a missing id creates a new option, and an id of
        another question answers `422`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestionRequest"
      responses:
        "200":
          description: The question at its (possibly new) current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `base_version` is no longer the current version: someone else saved first. The message asks
            the editor to reload; no write happened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [questions]
      summary: Delete a question and its versions
      description: |
        Versions, then the head row, are removed in one transaction. A version another slice already
        references (a tryout will, from P08) makes the database refuse and the whole delete roll back,
        answering `409`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The question and every version of it are gone
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A version of this question is still referenced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>` from `/api/v1/auth/login`, valid for 15 minutes.
        HS256 only; issuer `taruna-api`, audience `taruna-web`.

  schemas:
    Tenant:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          description: Subdomain label under `BASE_DOMAIN`. Immutable once created.
          example: taruna
        name:
          type: string
          description: Display name the landing page shows.
          example: Taruna Eduka

    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email or phone. Matched only within the tenant scope of the request host.
          example: naila@example.com
        password:
          type: string
          format: password
          description: At most 72 bytes; anything longer is refused like any other wrong password.

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 100
          example: Budi Santoso
        email:
          type: string
          description: Required (D01). Stored trimmed and lowercased.
          example: budi@example.com
        phone:
          type: string
          description: Optional. Indonesian local or international form; stored as E.164.
          example: 0812-3456-7890
        password:
          type: string
          format: password
          minLength: 8
          description: 8 characters to 72 bytes.

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          example: budi@example.com

    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "042917"

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: The value after `#token=` in the emailed link.
        password:
          type: string
          format: password
          minLength: 8
          description: 8 characters to 72 bytes.

    User:
      type: object
      additionalProperties: false
      required: [id, name, email, phone, role, email_verified]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
          description: Null when the account was created with a phone number only.
        phone:
          type: string
          nullable: true
          description: Null when the account was created with an email only.
        role:
          type: string
          enum: [student, operator, admin, platform_admin]
          description: |
            `platform_admin` only ever exists on the platform host; a tenant host sees its own roles.
        email_verified:
          type: boolean
          description: |
            False until the owner enters the emailed code or completes a password reset. D01: it
            never blocks anything; the web app shows an alert while it is false.

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: HS256 JWT for the `Authorization` header. Keep it in memory, not in storage.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 900
        user:
          $ref: "#/components/schemas/User"

    ProgramList:
      type: object
      additionalProperties: false
      required: [programs]
      properties:
        programs:
          type: array
          items:
            $ref: "#/components/schemas/Program"

    Program:
      type: object
      additionalProperties: false
      required: [id, code, name, description, subjects]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Unique per tenant. Always stored uppercased.
          example: SD
        name:
          type: string
        description:
          type: string
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/ProgramSubject"

    ProgramSubject:
      type: object
      additionalProperties: false
      required: [id, name, chapters]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/ProgramChapter"

    ProgramChapter:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CreateProgramRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          description: Trimmed and uppercased, then 2–12 characters of `A-Z`, `0-9`, `_` or `-`.
          example: SD
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        subjects:
          type: array
          maxItems: 50
          description: Order becomes `position`.
          items:
            $ref: "#/components/schemas/CreateSubjectRequest"

    CreateSubjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        chapters:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/CreateChapterRequest"

    CreateChapterRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100

    UpdateProgramRequest:
      type: object
      additionalProperties: false
      required: [code, name, description, subjects]
      properties:
        code:
          type: string
          description: Trimmed and uppercased, then 2–12 characters of `A-Z`, `0-9`, `_` or `-`.
          example: SD
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        subjects:
          type: array
          maxItems: 50
          description: |
            The complete tree: order becomes `position`, items without an `id` are created, and
            existing items missing from this array are deleted.
          items:
            $ref: "#/components/schemas/UpdateSubjectRequest"

    UpdateSubjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: Omit to create a subject; an existing id must belong to this program.
        name:
          type: string
          maxLength: 100
        chapters:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/UpdateChapterRequest"

    UpdateChapterRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: Omit to create a chapter; an existing id must belong to this program.
        name:
          type: string
          maxLength: 100

    QuestionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          description: |
            Assigned by the server and stable across versions; `benar`/`salah` for `benar_salah`.
        label:
          type: string
          maxLength: 500
        points:
          type: number
          minimum: 0
          maximum: 100
          description: |
            Only in weighted mode, at most 2 decimals. An option without points counts as 1 at scoring
            time (P16).

    Question:
      type: object
      additionalProperties: false
      required: [id, number, version, version_id, program_id, subject_id, chapter_id, type, content,
                 difficulty, explanation, option_weighted, case_sensitive, options, correct,
                 created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: The human ID the list shows (FR-ADM-SOA-06). Installation-wide, may skip.
        version:
          type: integer
          description: The current immutable version, starting at 1.
        version_id:
          type: string
          format: uuid
          description: The version row later slices reference (P08 assigns questions by version).
        program_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        content:
          type: string
          description: Stored verbatim as text; markdown and LaTeX render client-side.
        difficulty:
          type: string
          enum: [easy, medium, hard]
        explanation:
          type: string
        option_weighted:
          type: boolean
          description: Weighted-option mode, `pg` only.
        case_sensitive:
          type: boolean
          description: Short-answer matching, `isian` only.
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOption"
        correct:
          type: array
          description: Option ids for the choice types, accepted answers for `isian`, empty when weighted.
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QuestionList:
      type: object
      additionalProperties: false
      required: [questions, total]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        total:
          type: integer
          description: Every question the filters match, not only the page returned.

    QuestionOptionInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        id:
          type: string
          description: |
            An option id of this question keeps it; omit it to let the server assign one. A placeholder
            such as `a` may be named in `correct` and is replaced by the assigned id.
        label:
          type: string
          maxLength: 500
        points:
          type: number
          minimum: 0
          maximum: 100
          description: Weighted mode only, at most 2 decimals.

    CreateQuestionRequest:
      type: object
      additionalProperties: false
      required: [program_id, subject_id, type, content, difficulty]
      properties:
        program_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
          description: Must belong to `program_id`.
        chapter_id:
          type: string
          format: uuid
          nullable: true
          description: Optional; must belong to `subject_id`.
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        content:
          type: string
          maxLength: 20000
          description: Trimmed, 1–20000 characters. No HTML; `data:`/`javascript:` images are refused.
        difficulty:
          type: string
          enum: [easy, medium, hard]
        explanation:
          type: string
          maxLength: 20000
        option_weighted:
          type: boolean
          description: "`pg` only; then `correct` must be empty and every option may carry points."
        case_sensitive:
          type: boolean
          description: "`isian` only."
        options:
          type: array
          maxItems: 8
          description: |
            2–8 for the choice types, absent for `isian`, optional for `benar_salah` (the server fixes
            `benar`/`salah`).
          items:
            $ref: "#/components/schemas/QuestionOptionInput"
        correct:
          type: array
          maxItems: 10
          items:
            type: string

    UpdateQuestionRequest:
      type: object
      additionalProperties: false
      required: [program_id, subject_id, type, content, difficulty, base_version]
      properties:
        base_version:
          type: integer
          description: The version the editor started from; a mismatch answers `409`.
        program_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        content:
          type: string
          maxLength: 20000
        difficulty:
          type: string
          enum: [easy, medium, hard]
        explanation:
          type: string
          maxLength: 20000
        option_weighted:
          type: boolean
          description: "`pg` only; then `correct` must be empty and every option may carry points."
        case_sensitive:
          type: boolean
          description: "`isian` only."
        options:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/QuestionOptionInput"
        correct:
          type: array
          maxItems: 10
          items:
            type: string

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier. Switch on this, never on `message`.
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - validation_failed
                - too_many_requests
                - internal_error
            message:
              type: string
              description: Human-readable, Indonesian, safe to show to end users.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Present on validation_failed — maps field name to reason.
            request_id:
              type: string
              description: Correlates with the server log line for this request.

  responses:
    Unauthorized:
      description: No usable identity on the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The request is understood but not allowed, for example a rejected Origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: The request body is missing a field or is not the expected shape
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The request host selects no active tenant, or the resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds
      headers:
        Retry-After:
          description: Whole seconds until the current window ends.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
