            type: string
            format: uuid
        - name: limit
          in: query
          description: Defaults to 50, at most 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of the student's ledger, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletEntryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/students/{id}/wallet/adjustments:
    post:
      tags: [students]
      summary: Adjust one student's balance
      description: |
        Admin only (D02 is still open, so this is a role guard). A `credit` adds and a `debit`
        subtracts; `amount` is a positive decimal string with at most two fraction digits and the
        server signs it, so `1e3`, `1.234`, `0.00` and a minus sign all answer `422 on amount`.

        A movement that would take the balance below zero answers `422 on amount` with "Saldo tidak
        cukup." and writes nothing — it is never clamped. `reason` is required for every adjustment.

        `idempotency_key` (8–64 characters, `[A-Za-z0-9_-]`) identifies the financial operation: the
        same key with the same body answers `200` with the original entry and moves nothing, and the
        same key with another amount, type or student answers `409`. The first call answers `201`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
      responses:
        "201":
          description: The new ledger entry and the balance after it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentResult"
        "200":
          description: The original entry for this idempotency key, nothing written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>` from `/api/v1/auth/login`, valid for 15 minutes.
        HS256 only; issuer `taruna-api`, audience `taruna-web`.

  schemas:
    Tenant:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          description: Subdomain label under `BASE_DOMAIN`. Immutable once created.
          example: taruna
        name:
          type: string
          description: Display name the landing page shows.
          example: Taruna Eduka

    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email or phone. Matched only within the tenant scope of the request host.
          example: naila@example.com
        password:
          type: string
          format: password
          description: At most 72 bytes; anything longer is refused like any other wrong password.

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 100
          example: Budi Santoso
        email:
          type: string
          description: Required (D01). Stored trimmed and lowercased.
          example: budi@example.com
        phone:
          type: string
          description: Optional. Indonesian local or international form; stored as E.164.
          example: 0812-3456-7890
        password:
          type: string
          format: password
          minLength: 8
          description: 8 characters to 72 bytes.

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          example: budi@example.com

    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "042917"

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: The value after `#token=` in the emailed link.
        password:
          type: string
          format: password
          minLength: 8
          description: 8 characters to 72 bytes.

    User:
      type: object
      additionalProperties: false
      required: [id, name, email, phone, role, email_verified]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
          description: Null when the account was created with a phone number only.
        phone:
          type: string
          nullable: true
          description: Null when the account was created with an email only.
        role:
          type: string
          enum: [student, operator, admin, platform_admin]
          description: |
            `platform_admin` only ever exists on the platform host; a tenant host sees its own roles.
        email_verified:
          type: boolean
          description: |
            False until the owner enters the emailed code or completes a password reset. D01: it
            never blocks anything; the web app shows an alert while it is false.

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: HS256 JWT for the `Authorization` header. Keep it in memory, not in storage.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 900
        user:
          $ref: "#/components/schemas/User"

    ProgramList:
      type: object
      additionalProperties: false
      required: [programs]
      properties:
        programs:
          type: array
          items:
            $ref: "#/components/schemas/Program"

    Program:
      type: object
      additionalProperties: false
      required: [id, code, name, description, subjects]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Unique per tenant. Always stored uppercased.
          example: SD
        name:
          type: string
        description:
          type: string
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/ProgramSubject"

    ProgramSubject:
      type: object
      additionalProperties: false
      required: [id, name, chapters]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/ProgramChapter"

    ProgramChapter:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CreateProgramRequest:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          description: Trimmed and uppercased, then 2–12 characters of `A-Z`, `0-9`, `_` or `-`.
          example: SD
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        subjects:
          type: array
          maxItems: 50
          description: Order becomes `position`.
          items:
            $ref: "#/components/schemas/CreateSubjectRequest"

    CreateSubjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        chapters:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/CreateChapterRequest"

    CreateChapterRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100

    UpdateProgramRequest:
      type: object
      additionalProperties: false
      required: [code, name, description, subjects]
      properties:
        code:
          type: string
          description: Trimmed and uppercased, then 2–12 characters of `A-Z`, `0-9`, `_` or `-`.
          example: SD
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        subjects:
          type: array
          maxItems: 50
          description: |
            The complete tree: order becomes `position`, items without an `id` are created, and
            existing items missing from this array are deleted.
          items:
            $ref: "#/components/schemas/UpdateSubjectRequest"

    UpdateSubjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: Omit to create a subject; an existing id must belong to this program.
        name:
          type: string
          maxLength: 100
        chapters:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/UpdateChapterRequest"

    UpdateChapterRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: Omit to create a chapter; an existing id must belong to this program.
        name:
          type: string
          maxLength: 100

    QuestionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
          description: |
            Assigned by the server and stable across versions; `benar`/`salah` for `benar_salah`.
        label:
          type: string
          maxLength: 500
        points:
          type: number
          minimum: 0
          maximum: 100
          description: |
            Only in weighted mode, at most 2 decimals. An option without points counts as 1 at scoring
            time (P16).

    Question:
      type: object
      additionalProperties: false
      required: [id, number, version, version_id, program_id, subject_id, chapter_id, type, content,
                 difficulty, explanation, option_weighted, case_sensitive, options, correct,
                 created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: The human ID the list shows (FR-ADM-SOA-06). Installation-wide, may skip.
        version:
          type: integer
          description: The current immutable version, starting at 1.
        version_id:
          type: string
          format: uuid
          description: The version row later slices reference (P08 assigns questions by version).
        program_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        content:
          type: string
          description: Stored verbatim as text; markdown and LaTeX render client-side.
        difficulty:
          type: string
          enum: [easy, medium, hard]
        explanation:
          type: string
        option_weighted:
          type: boolean
          description: Weighted-option mode, `pg` only.
        case_sensitive:
          type: boolean
          description: Short-answer matching, `isian` only.
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionOption"
        correct:
          type: array
          description: Option ids for the choice types, accepted answers for `isian`, empty when weighted.
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    QuestionList:
      type: object
      additionalProperties: false
      required: [questions, total]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        total:
          type: integer
          description: Every question the filters match, not only the page returned.

    QuestionOptionInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        id:
          type: string
          description: |
            An option id of this question keeps it; omit it to let the server assign one. A placeholder
            such as `a` may be named in `correct` and is replaced by the assigned id.
        label:
          type: string
          maxLength: 500
        points:
          type: number
          minimum: 0
          maximum: 100
          description: Weighted mode only, at most 2 decimals.

    CreateQuestionRequest:
      type: object
      additionalProperties: false
      required: [program_id, subject_id, type, content, difficulty]
      properties:
        program_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
          description: Must belong to `program_id`.
        chapter_id:
          type: string
          format: uuid
          nullable: true
          description: Optional; must belong to `subject_id`.
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        content:
          type: string
          maxLength: 20000
          description: Trimmed, 1–20000 characters. No HTML; `data:`/`javascript:` images are refused.
        difficulty:
          type: string
          enum: [easy, medium, hard]
        explanation:
          type: string
          maxLength: 20000
        option_weighted:
          type: boolean
          description: "`pg` only; then `correct` must be empty and every option may carry points."
        case_sensitive:
          type: boolean
          description: "`isian` only."
        options:
          type: array
          maxItems: 8
          description: |
            2–8 for the choice types, absent for `isian`, optional for `benar_salah` (the server fixes
            `benar`/`salah`).
          items:
            $ref: "#/components/schemas/QuestionOptionInput"
        correct:
          type: array
          maxItems: 10
          items:
            type: string

    UpdateQuestionRequest:
      type: object
      additionalProperties: false
      required: [program_id, subject_id, type, content, difficulty, base_version]
      properties:
        base_version:
          type: integer
          description: The version the editor started from; a mismatch answers `409`.
        program_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        content:
          type: string
          maxLength: 20000
        difficulty:
          type: string
          enum: [easy, medium, hard]
        explanation:
          type: string
          maxLength: 20000
        option_weighted:
          type: boolean
          description: "`pg` only; then `correct` must be empty and every option may carry points."
        case_sensitive:
          type: boolean
          description: "`isian` only."
        options:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/QuestionOptionInput"
        correct:
          type: array
          maxItems: 10
          items:
            type: string

    QuestionImportRowPreview:
      type: object
      additionalProperties: false
      required: [type, content, program, subject, difficulty]
      properties:
        type:
          type: string
          description: The type as the parser read it, lowercased.
        content:
          type: string
          description: The cell text, verbatim.
        program:
          type: string
          description: The program name as written in the row.
        subject:
          type: string
          description: The subject name as written in the row.
        difficulty:
          type: string
          description: The normalized difficulty, or the cell text when it is unknown.

    QuestionImportRowError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: The spreadsheet column the row failed on, e.g. `program` or `option_b`.
          example: program
        message:
          type: string
          description: Human-readable, Indonesian, the same copy the editor shows.

    QuestionImportRow:
      type: object
      additionalProperties: false
      required: [row, valid, errors]
      properties:
        row:
          type: integer
          description: The 1-based data row number; the header is not listed.
        valid:
          type: boolean
        errors:
          type: array
          description: Empty when the row is valid.
          items:
            $ref: "#/components/schemas/QuestionImportRowError"
        preview:
          $ref: "#/components/schemas/QuestionImportRowPreview"

    QuestionImportPreview:
      type: object
      additionalProperties: false
      required: [file_name, format, total, valid, invalid, rows]
      properties:
        file_name:
          type: string
        format:
          type: string
          enum: [xlsx, csv, docx]
        total:
          type: integer
          description: Every data row in the file, at most 500.
        valid:
          type: integer
        invalid:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/QuestionImportRow"

    QuestionImportCommit:
      type: object
      additionalProperties: false
      required: [created, already_imported, question_ids]
      properties:
        created:
          type: integer
          description: Questions this commit wrote.
        already_imported:
          type: integer
          description: Selected rows this tenant had already imported from the same file.
        question_ids:
          type: array
          description: The ids of the questions this commit created.
          items:
            type: string
            format: uuid

    TryoutSummary:
      type: object
      additionalProperties: false
      required: [id, program_id, title, description, scoring_mode, status, active_from, active_until,
                 explanation_release_at, randomize_questions, randomize_options, revision, locked,
                 subtest_count, question_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        scoring_mode:
          type: string
          enum: [weighted, irt]
          description: D04 is open; only the mode is stored, never a weight.
        status:
          type: string
          enum: [draft, published]
        active_from:
          type: string
          format: date-time
          nullable: true
        active_until:
          type: string
          format: date-time
        explanation_release_at:
          type: string
          format: date-time
          nullable: true
        randomize_questions:
          type: boolean
        randomize_options:
          type: boolean
        revision:
          type: integer
          description: Bumped by every save; `base_revision` is what a concurrent save fails on.
        locked:
          type: boolean
          description: True once `first_attempt_at` is set — every edit, delete, publish and unpublish then answers `409`.
        subtest_count:
          type: integer
        question_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Assignment:
      type: object
      additionalProperties: false
      required: [question_id, version_id, version, number, type, difficulty, content, position]
      properties:
        question_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
          description: The frozen version; it is never replaced by a later edit of the question.
        version:
          type: integer
        number:
          type: integer
          format: int64
          description: The question's human number (`seq`).
        type:
          type: string
          enum: [pg, pg_multi, isian, benar_salah]
        difficulty:
          type: string
          enum: [easy, medium, hard]
        content:
          type: string
          description: The frozen content, verbatim. Answer keys stay on the question API.
        position:
          type: integer

    Subtest:
      type: object
      additionalProperties: false
      required: [id, name, duration_seconds, position, questions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        duration_seconds:
          type: integer
          minimum: 60
          maximum: 28800
        position:
          type: integer
          description: Stored order, starting at 1.
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Assignment"

    Tryout:
      type: object
      additionalProperties: false
      required: [id, program_id, title, description, scoring_mode, status, active_from, active_until,
                 explanation_release_at, randomize_questions, randomize_options, revision, locked,
                 subtest_count, question_count, created_at, updated_at, subtests]
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        scoring_mode:
          type: string
          enum: [weighted, irt]
        status:
          type: string
          enum: [draft, published]
        active_from:
          type: string
          format: date-time
          nullable: true
        active_until:
          type: string
          format: date-time
        explanation_release_at:
          type: string
          format: date-time
          nullable: true
        randomize_questions:
          type: boolean
        randomize_options:
          type: boolean
        revision:
          type: integer
        locked:
          type: boolean
        subtest_count:
          type: integer
        question_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        subtests:
          type: array
          items:
            $ref: "#/components/schemas/Subtest"

    TryoutList:
      type: object
      additionalProperties: false
      required: [tryouts, total]
      properties:
        tryouts:
          type: array
          description: Counts only — GET one tryout for its subtests and assignments.
          items:
            $ref: "#/components/schemas/TryoutSummary"
        total:
          type: integer
          description: Every tryout the filters match, not only the page returned.

    TryoutQuestionRequest:
      type: object
      additionalProperties: false
      required: [question_id]
      properties:
        question_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
          description: |
            Omit to assign the question's current version. A version this tryout already assigned to
            the question is kept; any other id answers `422` on this path.

    TryoutSubtestRequest:
      type: object
      additionalProperties: false
      required: [name, duration_seconds]
      properties:
        name:
          type: string
          maxLength: 200
        duration_seconds:
          type: integer
          minimum: 60
          maximum: 28800
        questions:
          type: array
          maxItems: 200
          description: Array order becomes `position`.
          items:
            $ref: "#/components/schemas/TryoutQuestionRequest"

    CreateTryoutRequest:
      type: object
      additionalProperties: false
      required: [program_id, title, scoring_mode, active_until]
      properties:
        program_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        scoring_mode:
          type: string
          enum: [weighted, irt]
        active_from:
          type: string
          format: date-time
          nullable: true
        active_until:
          type: string
          format: date-time
        explanation_release_at:
          type: string
          format: date-time
          nullable: true
        randomize_questions:
          type: boolean
        randomize_options:
          type: boolean
        subtests:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/TryoutSubtestRequest"

    UpdateTryoutRequest:
      type: object
      additionalProperties: false
      required: [program_id, title, scoring_mode, active_until, base_revision]
      properties:
        base_revision:
          type: integer
          description: The revision the builder opened; a mismatch answers `409`.
        program_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        scoring_mode:
          type: string
          enum: [weighted, irt]
        active_from:
          type: string
          format: date-time
          nullable: true
        active_until:
          type: string
          format: date-time
        explanation_release_at:
          type: string
          format: date-time
          nullable: true
        randomize_questions:
          type: boolean
        randomize_options:
          type: boolean
        subtests:
          type: array
          maxItems: 30
          description: The complete definition; subtests and assignments missing here are deleted.
          items:
            $ref: "#/components/schemas/TryoutSubtestRequest"

    ProductTryout:
      type: object
      additionalProperties: false
      required: [id, title, status, subtest_count, question_count]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [draft, published]
        subtest_count:
          type: integer
        question_count:
          type: integer

    Product:
      type: object
      additionalProperties: false
      required: [id, type, title, description, program_id, price, original_price, is_active, active_until,
                 tryouts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [individual, bundle]
        title:
          type: string
        description:
          type: string
        program_id:
          type: string
          format: uuid
        price:
          type: string
          description: Canonical decimal string with two fraction digits, for example `"150000.00"`. Never a float.
          example: "150000.00"
        original_price:
          type: string
          nullable: true
          description: The normal price when the product is discounted; never below `price`.
          example: "200000.00"
        is_active:
          type: boolean
        active_until:
          type: string
          format: date-time
          nullable: true
        tryouts:
          type: array
          items:
            $ref: "#/components/schemas/ProductTryout"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductList:
      type: object
      additionalProperties: false
      required: [products, total]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer

    ProductRequest:
      type: object
      additionalProperties: false
      required: [type, title, description, program_id, price, original_price, is_active, tryout_ids]
      properties:
        type:
          type: string
          enum: [individual, bundle]
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        program_id:
          type: string
          format: uuid
        price:
          type: string
          description: Decimal string, at most two fraction digits, greater than zero. `1e3`, `NaN` and `-1` are refused.
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          example: "150000"
        original_price:
          type: string
          nullable: true
          description: Same grammar as `price` and never below it; `null` means no discount.
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
        is_active:
          type: boolean
        active_until:
          type: string
          format: date-time
          nullable: true
        tryout_ids:
          type: array
          description: The complete package, in order. One id for `individual`, two to twenty for `bundle`.
          items:
            type: string
            format: uuid

    PublicProductTryout:
      type: object
      additionalProperties: false
      required: [id, title, subtest_count, question_count, duration_seconds_total]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        subtest_count:
          type: integer
        question_count:
          type: integer
        duration_seconds_total:
          type: integer

    PublicProduct:
      type: object
      additionalProperties: false
      required: [id, type, title, description, program_id, program_code, program_name, price, original_price,
                 discount_percent, active_until, tryouts]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [individual, bundle]
        title:
          type: string
        description:
          type: string
        program_id:
          type: string
          format: uuid
        program_code:
          type: string
        program_name:
          type: string
        price:
          type: string
          description: Canonical decimal string; the client formats it for display and never divides it.
          example: "150000.00"
        original_price:
          type: string
          nullable: true
        discount_percent:
          type: integer
          nullable: true
          description: Rounded whole percent, computed by the server; `null` when there is no discount.
        active_until:
          type: string
          format: date-time
          nullable: true
        tryouts:
          type: array
          items:
            $ref: "#/components/schemas/PublicProductTryout"

    PublicProductList:
      type: object
      additionalProperties: false
      required: [products, total]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/PublicProduct"
        total:
          type: integer

    CatalogSummary:
      type: object
      additionalProperties: false
      required: [programs, products, tryouts]
      properties:
        programs:
          type: integer
        products:
          type: integer
        tryouts:
          type: integer

    Wallet:
      type: object
      additionalProperties: false
      required: [balance, total_credits, total_debits]
      properties:
        balance:
          type: string
          description: The projection, a canonical decimal string with exactly two fraction digits.
          example: "150000.00"
        total_credits:
          type: string
          description: Sum of the positive ledger amounts, computed in SQL.
          example: "200000.00"
        total_debits:
          type: string
          description: Sum of the magnitude of the negative ledger amounts, computed in SQL.
          example: "50000.00"

    WalletEntry:
      type: object
      additionalProperties: false
      required: [id, seq, kind, amount, balance_after, actor_kind, actor_name, reason, source_type, source_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          description: Total order of the ledger; entries are listed newest first by it.
        kind:
          type: string
          enum: [opening, topup, spend, adjustment]
        amount:
          type: string
          description: Signed canonical decimal — `"50000.00"` or `"-25000.00"` — never a number.
          example: "-25000.00"
        balance_after:
          type: string
          description: The projection just after this movement, never negative.
          example: "125000.00"
        actor_kind:
          type: string
          enum: [system, student, provider, staff, platform]
        actor_name:
          type: string
          nullable: true
          description: A staff member's display name only, never their email or phone; null otherwise.
        reason:
          type: string
          description: Required for an adjustment, empty for every other kind.
        source_type:
          type: string
          description: The business source, for example `adjustment` or `order`.
        source_id:
          type: string
          description: Unique within the tenant together with `source_type`; the idempotency key for an adjustment.
        created_at:
          type: string
          format: date-time

    WalletEntryList:
      type: object
      additionalProperties: false
      required: [entries, total]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WalletEntry"
        total:
          type: integer

    WalletStudent:
      type: object
      additionalProperties: false
      required: [id, name, email, phone, balance, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        balance:
          type: string
          description: The student's projection, a canonical decimal string.
          example: "150000.00"
        created_at:
          type: string
          format: date-time

    WalletStudentList:
      type: object
      additionalProperties: false
      required: [students, total]
      properties:
        students:
          type: array
          items:
            $ref: "#/components/schemas/WalletStudent"
        total:
          type: integer

    AdjustmentRequest:
      type: object
      additionalProperties: false
      required: [type, amount, reason, idempotency_key]
      properties:
        type:
          type: string
          enum: [credit, debit]
          description: The direction; the server signs the amount, so `amount` itself is unsigned.
        amount:
          type: string
          description: A plain decimal above zero with at most two fraction digits, for example `"50000.00"`.
          example: "50000.00"
        reason:
          type: string
          description: Required, trimmed; an empty or blank reason answers `422 reason`.
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: Identifies the financial operation; a retry with the same key moves money once.

    AdjustmentResult:
      type: object
      additionalProperties: false
      required: [entry, balance]
      properties:
        entry:
          $ref: "#/components/schemas/WalletEntry"
        balance:
          type: string
          description: The projection after the adjustment, a canonical decimal string.
          example: "50000.00"

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier. Switch on this, never on `message`.
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - validation_failed
                - payload_too_large
                - too_many_requests
                - internal_error
            message:
              type: string
              description: Human-readable, Indonesian, safe to show to end users.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Present on validation_failed — maps field name to reason.
            request_id:
              type: string
              description: Correlates with the server log line for this request.

  responses:
    Unauthorized:
      description: No usable identity on the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The request is understood but not allowed, for example a rejected Origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: The request body is missing a field or is not the expected shape
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The request host selects no active tenant, or the resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds
      headers:
        Retry-After:
          description: Whole seconds until the current window ends.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: The request body is larger than the upload limit (5 MB plus multipart framing)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The request conflicts with the resource's current state, for example a reused idempotency key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
