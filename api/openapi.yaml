openapi: 3.0.3
info:
  title: Taruna Eduka — Tryout Platform API
  version: 0.1.0
  description: |
    Source of truth for the HTTP contract. The typed TypeScript client consumed by `web/`
    is generated from this file, so a breaking change here surfaces as a compile error in
    the frontend rather than a runtime surprise.

    Scope today is slices P00–P03b. Later slices extend this file; they do not fork it.
    Every `/api/v1/*` route resolves its tenant from the request host first, and the access token
    has to agree with that host, so a token minted for one tenant is refused everywhere else.
    P03a and P03b ship the API and the generated types only — the auth screens are P03c.

    Emails and phones are stored in one canonical form: a trimmed, lowercased email and an E.164
    phone (`0812…`, `62812…` and `+62 812-…` all become `+62812…`). Every route that takes an
    identifier normalizes it first, so any of those spellings reaches the same account.

servers:
  - url: http://localhost:8081
    description: Local development

tags:
  - name: system
    description: Liveness and readiness probes
  - name: tenant
    description: Public tenant lookup by request host
  - name: auth
    description: Sessions, tokens and the authenticated principal

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: Reports process health only. Does not touch the database by design.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: |
        Reports whether this instance can serve traffic, including database reachability.

        The 503 body is this endpoint's own shape — `{status, reason}` — and deliberately
        not the error envelope.
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, reason]
                properties:
                  status:
                    type: string
                    example: unavailable
                  reason:
                    type: string
                    example: database unreachable

  /api/v1/tenant:
    get:
      tags: [tenant]
      summary: Tenant for the request host
      description: |
        Resolves the tenant from the request host: `<slug>.<BASE_DOMAIN>` selects a tenant.

        An active tenant's slug and display name are public — the landing page needs them.
        An inactive, unknown, reserved, malformed or platform host answers the same `404`
        with the same code and message, so those cases cannot be told apart from outside.
      responses:
        "200":
          description: The tenant the request host resolves to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for an access token
      description: |
        `identifier` matches either the email or the phone column, but only inside the tenant the
        request host resolves to, so the same email in two tenants is two different people.

        Unknown identifier, inactive account and wrong password all answer the same `401` with the
        same message, and an account that does not exist costs the same password comparison as one
        that does. A password longer than 72 bytes is refused the same way, because bcrypt ignores
        everything past that.

        Attempts are counted per identifier and host before the password is checked: the 11th
        attempt within 15 minutes answers `429` with `Retry-After`, even with the right password.
        A successful login, or a password reset, clears the count.

        On success the refresh token is set as an `HttpOnly` cookie scoped to `/api/v1/auth` and is
        never part of the body. This route needs no `Origin`: it is authenticated by credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A session was opened
          headers:
            Set-Cookie:
              description: |
                `refresh_token=<opaque>; Path=/api/v1/auth; HttpOnly; SameSite=Lax; Max-Age=2592000`,
                plus `Secure` outside development.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Issue a new access token from the refresh cookie
      description: |
        Reads the refresh cookie, which must name a live session of this host's tenant. Idle time is
        enforced here: the server expires a session that has had no authenticated request for three
        hours. Refreshing is not activity, so it does not move that deadline — only an authenticated
        request on `/me` (or any later protected route) does.

        Every refresh rotates the token and sets the new one in the cookie. The replaced token keeps
        working for 30 seconds, so two tabs that refresh at once both succeed; such a response sets
        no cookie, because the winning refresh already set it. Presented after those 30 seconds, a
        replaced token can only be a copy, so the whole session is revoked and the current token
        stops working too.

        The refresh token never appears in the body. A request is refused with `403` unless its
        `Origin` is both accepted by the CORS policy and on the host this request resolved to. A
        token that can never work again also clears the cookie.
      responses:
        "200":
          description: A fresh access token for the same session
          headers:
            Set-Cookie:
              description: The rotated `refresh_token`; absent on a refresh inside the 30-second grace.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the session behind the refresh cookie
      description: |
        Revocation takes effect on the very next request: the access token is refused immediately,
        because every request re-reads the session row. Always answers `204` and always clears the
        cookie, so a retry, a stale token or no token at all is not an error to the client.

        Like refresh, this route requires an `Origin` that is both CORS-accepted and on this
        request's host.
      responses:
        "204":
          description: The session is gone; the cookie is cleared with `Max-Age=0`
          headers:
            Set-Cookie:
              description: "`refresh_token=; Path=/api/v1/auth; HttpOnly; SameSite=Lax; Max-Age=0`"
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Start a student signup and email a verification code
      description: |
        D01: email is required and the phone is optional; both must be free in this tenant. Nothing
        becomes an account yet: the signup is kept pending and a 6-digit code is emailed. It works
        for 10 minutes and for at most 5 guesses. Signing up again with the same email replaces the
        pending details and the code. At most 5 codes go to one email per hour across this route and
        `/register/resend`.

        Registration exists only on tenant hosts; the platform host answers `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: The code is on its way
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSent"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An account already holds the email (`fields.email`) or the phone (`fields.phone`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/register/resend:
    post:
      tags: [auth]
      summary: Email a fresh verification code
      description: |
        Replaces the pending code and restores its 5 guesses. An email with no pending signup gets the
        same `202` and no email. Within 60 seconds of the last code this answers `429`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: A code is on its way if a signup is pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSent"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/register/verify:
    post:
      tags: [auth]
      summary: Verify the code, create the student account and open its session
      description: |
        A wrong, expired, used-up or unknown code all answer the same `422` with `fields.code`. A
        wrong guess is counted even under concurrent requests. On success the answer is exactly a
        login's: a token body and the refresh cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: The account exists and a session is open
          headers:
            Set-Cookie:
              description: The `refresh_token` cookie, as on login.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another account took the email or phone while this signup was pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      summary: Email a password reset link
      description: |
        FR-AUTH-03. Answers `202` with no body for every well-formed email, whether or not an account
        on this host has it, so the answer reveals nothing. A matching active account gets a link to
        `/reset-password#token=…` on this host's web app; it works once, for 30 minutes, and asking
        again retires the previous link. The limit is 3 requests per email per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: A link is on its way if the email belongs to an account here
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      description: |
        Spends the token, sets the password and revokes every session of the account. An unknown,
        used, expired or other-host token answers `422` with `fields.token`. The user logs in again
        afterwards; no session is opened here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: The password is changed and every session is ended
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me:
    get:
      tags: [auth]
      summary: The authenticated principal
      description: |
        Returns the caller the server rebuilt from the access token, the session row and the user
        row — not from the token alone. A revoked session, a role change or a deactivated account
        invalidates an old token on the next request. Balance and the ledger are not part of
        identity and are not published here.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The request host selects no active tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>` from `/api/v1/auth/login`, valid for 15 minutes.
        HS256 only; issuer `taruna-api`, audience `taruna-web`.

  schemas:
    Tenant:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          description: Subdomain label under `BASE_DOMAIN`. Immutable once created.
          example: taruna
        name:
          type: string
          description: Display name the landing page shows.
          example: Taruna Eduka

    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email or phone. Matched only within the tenant scope of the request host.
          example: naila@example.com
        password:
          type: string
          format: password
          description: At most 72 bytes; anything longer is refused like any other wrong password.

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 100
          example: Budi Santoso
        email:
          type: string
          description: Required (D01). Stored trimmed and lowercased.
          example: budi@example.com
        phone:
          type: string
          description: Optional. Indonesian local or international form; stored as E.164.
          example: 0812-3456-7890
        password:
          type: string
          format: password
          minLength: 8
          description: 8 characters to 72 bytes.

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          example: budi@example.com

    VerifyRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          example: budi@example.com
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "042917"

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: The value after `#token=` in the emailed link.
        password:
          type: string
          format: password
          minLength: 8
          description: 8 characters to 72 bytes.

    CodeSent:
      type: object
      additionalProperties: false
      required: [email, expires_in, resend_after]
      properties:
        email:
          type: string
          description: The normalized email the code went to.
        expires_in:
          type: integer
          description: Seconds the code stays valid.
          example: 600
        resend_after:
          type: integer
          description: Seconds before another code may be requested.
          example: 60

    User:
      type: object
      additionalProperties: false
      required: [id, name, email, phone, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          nullable: true
          description: Null when the account was created with a phone number only.
        phone:
          type: string
          nullable: true
          description: Null when the account was created with an email only.
        role:
          type: string
          enum: [student, operator, admin, platform_admin]
          description: |
            `platform_admin` only ever exists on the platform host; a tenant host sees its own roles.

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: HS256 JWT for the `Authorization` header. Keep it in memory, not in storage.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 900
        user:
          $ref: "#/components/schemas/User"

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier. Switch on this, never on `message`.
              enum:
                - bad_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - validation_failed
                - too_many_requests
                - internal_error
            message:
              type: string
              description: Human-readable, Indonesian, safe to show to end users.
            fields:
              type: object
              additionalProperties:
                type: string
              description: Present on validation_failed — maps field name to reason.
            request_id:
              type: string
              description: Correlates with the server log line for this request.

  responses:
    Unauthorized:
      description: No usable identity on the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The request is understood but not allowed, for example a rejected Origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: The request body is missing a field or is not the expected shape
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The request host selects no active tenant, or the resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds
      headers:
        Retry-After:
          description: Whole seconds until the current window ends.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
