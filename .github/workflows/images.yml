name: Images

# Builds images only; deploying is a manual step on the VPS (docs/deployment.md).
# Release = push a v* tag. workflow_dispatch builds a SHA tag only, which deploy.sh cannot deploy.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: images
  cancel-in-progress: false

env:
  DOMAIN: tarunaedu.com
  REGISTRY: ghcr.io/panca1093

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: api
          - name: web
            context: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ env.REGISTRY }}/taruna-hub-${{ matrix.name }}
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tags="$IMAGE:$SHA"
          if [ "$REF_TYPE" = tag ]; then
            [[ $REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "tag $REF_NAME is not a version tag" >&2; exit 1; }
            tags="$tags,$IMAGE:$REF_NAME"
          fi
          echo "list=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Same-origin: the browser and server renders both call https://DOMAIN/api.
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ env.DOMAIN }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
