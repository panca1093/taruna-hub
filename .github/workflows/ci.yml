name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tryout
          POSTGRES_PASSWORD: tryout
          POSTGRES_DB: tryout
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tryout -d tryout"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://tryout:tryout@localhost:5433/tryout?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Verify dependencies are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go build ./...
      - run: go vet ./...

      - name: Apply migrations
        run: make migrate-up

      - run: go test ./... -race

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Check generated API client is current
        run: |
          npm run gen:api
          git diff --exit-code lib/api/schema.ts

      - run: npx tsc --noEmit
      - run: npm run build
